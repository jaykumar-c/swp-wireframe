<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWP Module Wireframes</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#007AFF;--ink:#1C1C1C;--muted:rgba(50,71,92,.6);--line:#E5E7EB;--bg:#F5F5F9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);font-family:Montserrat,system-ui,sans-serif;color:var(--ink)}
.bar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 20px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;white-space:nowrap}
.tabs{display:flex;gap:4px;height:100%;overflow-x:auto}
.tab{display:flex;align-items:center;gap:10px;padding:0 16px;border:none;background:none;font:600 14px Montserrat;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab small{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#EEF2F7;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.tab.on small{background:rgba(0,122,255,.1);color:var(--primary)}
.meta{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
iframe{display:none;width:100%;height:calc(100vh - 60px);border:0;background:#fff}
iframe.on{display:block}
@media (max-width:760px){.meta{display:none}.brand span{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><svg width="26" height="26" viewBox="0 0 34 34"><circle cx="11" cy="12" r="8" fill="none" stroke="#16A34A" stroke-width="3"/><circle cx="22" cy="12" r="8" fill="none" stroke="#007AFF" stroke-width="3"/><circle cx="16" cy="22" r="8" fill="none" stroke="#E63900" stroke-width="3"/></svg><span>ShallWe-Play</span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="chat" onclick="show('chat')">Communication Module <small>Player App · 18 screens</small></button>
    <button class="tab" role="tab" data-t="email" onclick="show('email')">Email Templates <small>Admin Portal · 12 steps</small></button>
  </div>
  <div class="meta">Business Analysis · Mukund Patil<br>26 Nov 2026</div>
</div>
<iframe id="f-chat" title="Communication Module wireframes" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;SWP Chat Wireframes&lt;/title&gt;
&lt;link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;&gt;
&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Lato:wght@400;700&amp;family=Montserrat:wght@500;600;700;800&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;script type=&quot;module&quot; src=&quot;https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js&quot;&gt;&lt;/script&gt;
&lt;style&gt;
/* ===== Tokens: copied from shallwe-play-players/src/constants/Colors.ts (light) + BookingsScreen.tsx tabs ===== */
:root{
  --primary:#007AFF; --tab-active:#3B82F6; --tab-wrap:#E1EAEA; --seg-text:#1F2937;
  --text:#11181C; --text2:#777777; --icon:#687076; --bg:#f0f0f0; --card:#FFFFFF;
  --border:#E5E5E5; --danger:#E63900; --error:#FF3B30; --success:#22C55E; --disabled:#BDBDBD;
  --primary-soft:rgba(0,122,255,.08); --danger-soft:rgba(230,57,0,.08); --success-soft:rgba(34,197,94,.10);
  --warn-bg:#FEF3C7; --warn-text:#92400E;
  /* page chrome (not part of the app) */
  --page:#F5F5F9; --ink:#1C1C1C; --muted:#64748B; --line:#E2E8F0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);font-family:&#x27;Lato&#x27;,system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit}

/* ===== Page layout ===== */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font:700 18px Montserrat}
.top p{font-size:13px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.layout{display:grid;grid-template-columns:250px 1fr 360px;gap:20px;max-width:1440px;margin:0 auto;padding:20px 24px}
.nav{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;align-self:start;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.nav h4{font:600 11px Montserrat;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 8px 6px}
.nav h4:first-child{margin-top:4px}
.nav button{display:flex;gap:8px;width:100%;text-align:left;padding:8px;border-radius:6px;font-size:14px;color:var(--ink)}
.nav button .n{font:600 12px Montserrat;color:var(--muted);min-width:20px}
.nav button:hover{background:#F1F5F9}
.nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav button.on .n{color:var(--primary)}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.switch{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.switch button{padding:7px 14px;border-radius:6px;font:600 13px Montserrat;color:var(--muted)}
.switch button.on{background:var(--primary);color:#fff}
.switch button.na{opacity:.45}
.variants{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:30px}
.variants button{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted)}
.variants button.on{border-color:var(--primary);color:var(--primary);font-weight:700}
.notes{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;align-self:start;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.notes h2{font:700 18px Montserrat;margin-bottom:4px}
.notes .flow{font:600 11px Montserrat;text-transform:uppercase;letter-spacing:.6px;color:var(--primary)}
.notes h5{font:600 11px Montserrat;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 6px}
.notes p,.notes li{font-size:14px;line-height:1.5;color:#334155}
.notes ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pend{background:var(--warn-bg);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.45;color:var(--warn-text)}
.pend b{display:block;font:700 12px Montserrat;margin-bottom:2px}
.chg li{color:#334155}
.src{font-size:12px!important;color:var(--muted)!important;font-family:ui-monospace,Menlo,monospace}
.statebox{font-size:13px;background:#F8FAFC;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:#334155}

@media (max-width:1100px){.layout{grid-template-columns:1fr}.nav,.notes{position:static;max-height:none}}

/* ===== Phone shell ===== */
.ph{width:375px;height:780px;border-radius:44px;border:10px solid #11181C;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(17,24,28,.18)}
.sbar{height:34px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:700 14px Lato;color:var(--text)}
.sbar .r{display:flex;gap:4px;font-size:15px}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;font-family:&#x27;Lato&#x27;,sans-serif;color:var(--text)}
.body{flex:1;overflow-y:auto;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.homebar{height:20px;flex-shrink:0;display:flex;justify-content:center;align-items:center}
.homebar i{width:120px;height:4px;border-radius:2px;background:#11181C;opacity:.85}

/* ===== App components (matched to live RN styles) ===== */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-shrink:0;min-height:56px}
.hdr .t{font:800 20px/25px Montserrat;letter-spacing:.5px;text-transform:uppercase;text-align:center;flex:1}
.back{width:36px;height:36px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:var(--text)}
.hbtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--primary);flex-shrink:0;position:relative}
.hbtn.grey{color:var(--icon)}
.sp36{width:36px;flex-shrink:0}
.chdr{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;min-height:60px}
.chdr .who{flex:1;min-width:0}
.chdr .nm{font:700 16px/20px Montserrat;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.chdr .sub{font-size:13px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:600 16px Lato;flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;margin:0 16px 12px;border:1.5px solid var(--primary);border-radius:12px;padding:10px 12px;background:transparent}
.search ion-icon{font-size:20px;color:var(--primary)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--text)}
.search input::placeholder{color:#9CA3AF}
.tabs{display:flex;margin:0 16px 12px;background:var(--tab-wrap);border-radius:8px;padding:8px}
.tabs button{flex:1;padding:10px 0;background:#fff;font:500 12px Lato;color:var(--seg-text);border-radius:0}
.tabs button:first-child{border-radius:6px 0 0 6px}
.tabs button:last-child{border-radius:0 6px 6px 0}
.tabs button.on{background:var(--tab-active);color:#fff}
.sec{font:600 12px Montserrat;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);padding:4px 20px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:12px;margin:0 16px 8px}
.row .info{flex:1;min-width:0}
.row .l1{display:flex;align-items:center;gap:6px;justify-content:space-between}
.row .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:12px;color:var(--text2);flex-shrink:0}
.row .l2{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:3px}
.row .pv{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv.b{color:var(--text);font-weight:700}
.row.dim .nm,.row.dim .pv{color:var(--text2)}
.badge{min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--primary);color:#fff;font:700 12px Lato;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:6px;font:700 11px Lato;flex-shrink:0;background:var(--primary-soft);color:var(--primary)}
.tag.grey{background:#EBEBEB;color:var(--text2)}
.tag.green{background:var(--success-soft);color:#15803D}
.tag.warn{background:var(--warn-bg);color:var(--warn-text)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.feed{flex:1;overflow-y:auto;scrollbar-width:none;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.feed::-webkit-scrollbar{display:none}
.dd{align-self:center;font:700 12px Lato;color:var(--text2);padding:6px 0}
.sys{align-self:center;max-width:88%;text-align:center;font-size:13px;line-height:1.4;color:var(--text2);background:#E7E7E7;border-radius:10px;padding:6px 12px}
.msg{display:flex;gap:8px;max-width:80%;align-items:flex-end}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;flex-direction:row-reverse}
.msg .col{display:flex;flex-direction:column;min-width:0}
.msg.out .col{align-items:flex-end}
.snd{font:700 12px Lato;color:var(--icon);margin:0 0 3px 4px}
.snd .tag{height:17px;font-size:10px;margin-left:4px;padding:0 5px}
.bub{padding:9px 12px;border-radius:16px;font-size:15px;line-height:21px;word-wrap:break-word}
.in .bub{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.out .bub{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.mt{font-size:12px;color:var(--text2);margin:3px 4px 0}
.mt.err{color:var(--error);display:flex;align-items:center;gap:4px;font-weight:700}
.out .bub.failed{background:#8FBFFF}
.photo{width:200px;height:140px;border-radius:12px;background:linear-gradient(135deg,#C9D6E3,#9FB3C8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;position:relative;overflow:hidden}
.photo .vid{position:absolute;bottom:8px;left:8px;font:700 12px Lato;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 6px;display:flex;align-items:center;gap:3px}
.shared{width:240px;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.shared .h{background:var(--primary-soft);padding:8px 12px;font:700 12px Montserrat;color:var(--primary);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.4px}
.shared .c{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.shared .c b{font-size:15px}
.shared .c span{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
.shared .c .btn{margin-top:6px;height:38px;font-size:14px}
.comp{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-top:1px solid var(--border);flex-shrink:0}
.comp .att{font-size:24px;color:var(--icon);display:flex}
.comp .in{flex:1;height:40px;border-radius:20px;background:var(--bg);border:1px solid transparent;padding:0 14px;font-size:15px;outline:none;color:var(--text)}
.comp .in:focus{border-color:var(--primary);background:#fff}
.comp .send{width:40px;height:40px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.comp .send.off{background:var(--disabled)}
.lock{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;background:#fff;border-top:1px solid var(--border);flex-shrink:0}
.lock ion-icon{font-size:20px;color:var(--icon);flex-shrink:0;margin-top:1px}
.lock b{font-size:14px;display:block}
.lock span{font-size:13px;color:var(--text2);line-height:1.4}
.ctx{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;flex-shrink:0}
.ctx .ti{width:40px;height:40px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ctx .i{flex:1;min-width:0}
.ctx b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx span{font-size:13px;color:var(--text2)}
.ctx a{font:700 14px Lato;color:var(--primary);text-decoration:none;flex-shrink:0}
.ban{display:flex;gap:8px;align-items:flex-start;padding:8px 16px;font-size:13px;line-height:1.4;flex-shrink:0}
.ban ion-icon{font-size:17px;flex-shrink:0;margin-top:1px}
.ban.info{background:#EAF3FF;color:var(--text)}
.ban.info ion-icon{color:var(--primary)}
.ban.warn{background:var(--warn-bg);color:var(--warn-text)}
.ban.err{background:var(--danger-soft);color:var(--danger)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:8px;font:600 16px Montserrat}
.btn.p{background:var(--primary);color:#fff}
.btn.p.off{background:var(--disabled)}
.btn.n{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn.d{background:var(--danger);color:#fff}
.btn.sm{height:40px;font-size:14px}
.btnrow{display:flex;gap:10px}
.foot{padding:12px 16px 8px;flex-shrink:0;background:var(--bg)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px;gap:10px}
.center .bigic{width:88px;height:88px;border-radius:44px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--icon);box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:8px}
.center .bigic.red{color:var(--error)}
.center h3{font:700 18px Montserrat}
.center p{font-size:15px;line-height:22px;color:var(--text2)}
.center .btn{margin-top:10px;width:auto;padding:0 24px}
.sk{background:#E2E2E2;border-radius:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.ov{position:absolute;inset:0;background:rgba(17,24,28,.45);display:flex;z-index:20}
.ov.bottom{align-items:flex-end}
.ov.mid{align-items:center;justify-content:center;padding:24px}
.sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:8px 0 16px}
.sheet .hd{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 8px}
.sheet .st{font:700 16px Montserrat;padding:6px 20px 10px}
.sheet .it{display:flex;align-items:center;gap:14px;padding:0 20px;height:52px;font-size:16px;width:100%;text-align:left}
.sheet .it ion-icon{font-size:22px;color:var(--icon)}
.sheet .it.red,.sheet .it.red ion-icon{color:var(--danger)}
.modal{width:100%;background:#fff;border-radius:12px;padding:20px}
.modal h3{font:700 18px Montserrat;margin-bottom:8px}
.modal p{font-size:15px;line-height:22px;color:var(--text2);margin-bottom:18px}
.notch{position:relative;border:1px solid var(--border);border-radius:8px;min-height:56px;padding:16px;margin:12px 0 4px;background:transparent}
.notch.foc{border-color:var(--primary)}
.notch.bad{border-color:var(--error)}
.notch label{position:absolute;top:-10px;left:12px;padding:0 4px;background:var(--bg);font-size:14px;color:var(--text2)}
.notch.foc label{color:var(--primary)}
.notch.bad label{color:var(--error)}
.notch .v{font-size:16px}
.ferr{font-size:12px;color:var(--error);margin:4px 4px 0}
.fhelp{font-size:12px;color:var(--text2);margin:4px 4px 0;display:flex;justify-content:space-between}
.radio{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:14px 12px;margin-bottom:8px;font-size:15px}
.radio i{width:20px;height:20px;border-radius:10px;border:2px solid var(--disabled);flex-shrink:0}
.radio.on i{border:6px solid var(--primary)}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--disabled);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.chk.on{background:var(--primary);border-color:var(--primary)}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;width:56px;flex-shrink:0;position:relative}
.chip .x{position:absolute;top:-2px;right:4px;width:18px;height:18px;border-radius:9px;background:var(--icon);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid var(--bg)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#11181C;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;z-index:30;display:flex;gap:8px;align-items:center}
.push{margin:8px 10px;background:rgba(255,255,255,.96);border-radius:16px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:10px}
.push .app{width:22px;height:22px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0}
.push .h{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:2px}
.push b{font-size:15px;display:block}
.push p{font-size:14px;color:var(--text);margin-top:1px}
.prof-cover{height:110px;background:linear-gradient(135deg,#9FB3C8,#5E7A96)}
.prof{padding:0 16px;margin-top:-36px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.prof .av{border:4px solid var(--bg)}
.prof h3{font:700 20px Montserrat;margin-top:6px}
.prof p{font-size:14px;color:var(--text2)}
.stat3{display:flex;justify-content:center;gap:24px;margin:12px 0}
.stat3 div{text-align:center;font-size:13px;color:var(--text2)}

      &lt;div class=&quot;sbar&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;r&quot;&gt;&lt;ion-icon name=&quot;cellular&quot;&gt;&lt;/ion-icon&gt;&lt;ion-icon name=&quot;wifi&quot;&gt;&lt;/ion-icon&gt;&lt;ion-icon name=&quot;battery-full&quot;&gt;&lt;/ion-icon&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;scr&quot; id=&quot;scr&quot;&gt;&lt;/div&gt;

&lt;script&gt;
/* ---------------- helpers ---------------- */
const ic = (n, s=&#x27;&#x27;, st=&#x27;&#x27;) =&gt; `&lt;ion-icon name=&quot;${n}&quot; ${s?`style=&quot;font-size:${s}px;${st}&quot;`:(st?`style=&quot;${st}&quot;`:&#x27;&#x27;)}&gt;&lt;/ion-icon&gt;`;
const AVC = {E:&#x27;#E67E22&#x27;,S:&#x27;#3B82F6&#x27;,L:&#x27;#8B5CF6&#x27;,M:&#x27;#0D9488&#x27;,A:&#x27;#007AFF&#x27;,C:&#x27;#061D42&#x27;,T:&#x27;#DB2777&#x27;,J:&#x27;#16A34A&#x27;,R:&#x27;#64748B&#x27;};
const av = (t, size=44, bg, icon) =&gt; `&lt;div class=&quot;av&quot; style=&quot;width:${size}px;height:${size}px;background:${bg||AVC[t[0]]||&#x27;#007AFF&#x27;};font-size:${Math.round(size*.36)}px&quot;&gt;${icon?ic(icon, Math.round(size*.46)):t}&lt;/div&gt;`;
const back = (to) =&gt; `&lt;button class=&quot;back&quot; onclick=&quot;go(&#x27;${to||&#x27;&#x27;}&#x27;)&quot;&gt;${ic(&#x27;chevron-back&#x27;,16)}&lt;/button&gt;`;
const hdr = (title, left, right) =&gt; `&lt;div class=&quot;hdr&quot;&gt;${left||&#x27;&lt;div class=&quot;sp36&quot;&gt;&lt;/div&gt;&#x27;}&lt;div class=&quot;t&quot;&gt;${title}&lt;/div&gt;${right||&#x27;&lt;div class=&quot;sp36&quot;&gt;&lt;/div&gt;&#x27;}&lt;/div&gt;`;
const chdr = (avatar, name, sub, right, backTo=&#x27;inbox&#x27;) =&gt; `&lt;div class=&quot;chdr&quot;&gt;${back(backTo)}${avatar}&lt;div class=&quot;who&quot;&gt;&lt;div class=&quot;nm&quot;&gt;${name}&lt;/div&gt;&lt;div class=&quot;sub&quot;&gt;${sub}&lt;/div&gt;&lt;/div&gt;${right||&#x27;&#x27;}&lt;/div&gt;`;
const more = (fn) =&gt; `&lt;button class=&quot;hbtn grey&quot; onclick=&quot;${fn||&quot;go(&#x27;chat_options&#x27;)&quot;}&quot;&gt;${ic(&#x27;ellipsis-vertical&#x27;,22)}&lt;/button&gt;`;
const search = (ph) =&gt; `&lt;div class=&quot;search&quot;&gt;${ic(&#x27;search&#x27;)}&lt;input placeholder=&quot;${ph}&quot;&gt;&lt;/div&gt;`;
const tabs = (list, on) =&gt; `&lt;div class=&quot;tabs&quot;&gt;${list.map(t=&gt;`&lt;button class=&quot;${t===on?&#x27;on&#x27;:&#x27;&#x27;}&quot;&gt;${t}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
const dd = (t) =&gt; `&lt;div class=&quot;dd&quot;&gt;${t}&lt;/div&gt;`;
const sys = (t) =&gt; `&lt;div class=&quot;sys&quot;&gt;${t}&lt;/div&gt;`;
const mIn = (text, time, sender, role) =&gt; `&lt;div class=&quot;msg in&quot;&gt;${sender?av(sender[0],28):&#x27;&#x27;}&lt;div class=&quot;col&quot;&gt;${sender?`&lt;div class=&quot;snd&quot;&gt;${sender}${role?`&lt;span class=&quot;tag ${role===&#x27;Coach&#x27;||role===&#x27;Club Staff&#x27;||role===&#x27;SWP Support&#x27;?&#x27;&#x27;:&#x27;grey&#x27;}&quot;&gt;${role}&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;bub&quot;&gt;${text}&lt;/div&gt;&lt;div class=&quot;mt&quot;&gt;${time}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
const mOut = (text, time, failed) =&gt; `&lt;div class=&quot;msg out&quot;&gt;&lt;div class=&quot;col&quot;&gt;&lt;div class=&quot;bub ${failed?&#x27;failed&#x27;:&#x27;&#x27;}&quot;&gt;${text}&lt;/div&gt;${failed?`&lt;div class=&quot;mt err&quot;&gt;${ic(&#x27;alert-circle&#x27;,14)} Not sent · Tap to retry&lt;/div&gt;`:`&lt;div class=&quot;mt&quot;&gt;${time}&lt;/div&gt;`}&lt;/div&gt;&lt;/div&gt;`;
const photoMsg = (dir, time, video) =&gt; `&lt;div class=&quot;msg ${dir}&quot;&gt;&lt;div class=&quot;col&quot;&gt;&lt;div class=&quot;photo&quot;&gt;${ic(video?&#x27;play-circle&#x27;:&#x27;image-outline&#x27;,36)}${video?`&lt;span class=&quot;vid&quot;&gt;${ic(&#x27;videocam&#x27;,12)} 0:14&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;mt&quot;&gt;${time}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
const comp = (ph, typed) =&gt; `&lt;div class=&quot;comp&quot;&gt;&lt;button class=&quot;att&quot; onclick=&quot;go(&#x27;media_preview&#x27;)&quot;&gt;${ic(&#x27;image-outline&#x27;)}&lt;/button&gt;&lt;input class=&quot;in&quot; placeholder=&quot;${ph}&quot; value=&quot;${typed||&#x27;&#x27;}&quot;&gt;&lt;button class=&quot;send ${typed?&#x27;&#x27;:&#x27;off&#x27;}&quot;&gt;${ic(&#x27;send&#x27;,18)}&lt;/button&gt;&lt;/div&gt;`;
const lock = (title, text, icon=&#x27;lock-closed-outline&#x27;) =&gt; `&lt;div class=&quot;lock&quot;&gt;${ic(icon)}&lt;div&gt;&lt;b&gt;${title}&lt;/b&gt;&lt;span&gt;${text}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
const ctx = (icon, title, sub, link=&#x27;View&#x27;) =&gt; `&lt;div class=&quot;ctx&quot;&gt;&lt;div class=&quot;ti&quot;&gt;${ic(icon)}&lt;/div&gt;&lt;div class=&quot;i&quot;&gt;&lt;b&gt;${title}&lt;/b&gt;&lt;span&gt;${sub}&lt;/span&gt;&lt;/div&gt;&lt;a href=&quot;#&quot; onclick=&quot;return false&quot;&gt;${link}&lt;/a&gt;&lt;/div&gt;`;
const ban = (kind, icon, html) =&gt; `&lt;div class=&quot;ban ${kind}&quot;&gt;${ic(icon)}&lt;div&gt;${html}&lt;/div&gt;&lt;/div&gt;`;
const center = (icon, title, text, btn, red) =&gt; `&lt;div class=&quot;center&quot;&gt;&lt;div class=&quot;bigic ${red?&#x27;red&#x27;:&#x27;&#x27;}&quot;&gt;${ic(icon)}&lt;/div&gt;&lt;h3&gt;${title}&lt;/h3&gt;&lt;p&gt;${text}&lt;/p&gt;${btn||&#x27;&#x27;}&lt;/div&gt;`;
const errBlock = (title, text) =&gt; center(&#x27;cloud-offline-outline&#x27;, title, text, `&lt;button class=&quot;btn p sm&quot;&gt;${ic(&#x27;refresh&#x27;,18)} Try Again&lt;/button&gt;`, true);
const skRows = (n=6) =&gt; Array.from({length:n}).map(()=&gt;`&lt;div class=&quot;row&quot;&gt;&lt;div class=&quot;sk&quot; style=&quot;width:44px;height:44px;border-radius:22px&quot;&gt;&lt;/div&gt;&lt;div class=&quot;info&quot;&gt;&lt;div class=&quot;sk&quot; style=&quot;width:55%;height:14px;margin-bottom:8px&quot;&gt;&lt;/div&gt;&lt;div class=&quot;sk&quot; style=&quot;width:85%;height:12px&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
const skFeed = () =&gt; `&lt;div class=&quot;feed&quot;&gt;${[[&#x27;in&#x27;,62],[&#x27;in&#x27;,40],[&#x27;out&#x27;,55],[&#x27;in&#x27;,70],[&#x27;out&#x27;,38]].map(([d,w])=&gt;`&lt;div class=&quot;msg ${d}&quot;&gt;&lt;div class=&quot;sk&quot; style=&quot;width:${w*2.4}px;height:38px;border-radius:16px&quot;&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
const naNote = (why) =&gt; `&lt;div class=&quot;center&quot;&gt;&lt;div class=&quot;bigic&quot;&gt;${ic(&#x27;information-circle-outline&#x27;)}&lt;/div&gt;&lt;h3&gt;Not Applicable&lt;/h3&gt;&lt;p&gt;${why}&lt;/p&gt;&lt;/div&gt;`;

/* ---------------- shared data ---------------- */
const CONVOS = [
  {nm:&#x27;Padel · Court 4&#x27;, av:av(&#x27;&#x27;,44,&#x27;#007AFF&#x27;,&#x27;tennisball&#x27;), tag:&#x27;&lt;span class=&quot;tag&quot;&gt;Booking&lt;/span&gt;&#x27;, pv:&#x27;Sander: I\&#x27;ll bring new balls&#x27;, tm:&#x27;10:42&#x27;, un:2, to:&#x27;booking_chat&#x27;},
  {nm:&#x27;Emma de Vries&#x27;, av:av(&#x27;E&#x27;), pv:&#x27;Are you free for padel on Sunday?&#x27;, tm:&#x27;Yesterday&#x27;, un:1, to:&#x27;direct_chat&#x27;},
  {nm:&#x27;Club de Padel Rotterdam&#x27;, av:av(&#x27;&#x27;,44,&#x27;#061D42&#x27;,&#x27;business&#x27;), tag:&#x27;&lt;span class=&quot;tag&quot;&gt;Club&lt;/span&gt;&#x27;, pv:&#x27;You: Is Court 4 lit on Friday evening?&#x27;, tm:&#x27;Tue&#x27;, un:0, to:&#x27;club_chat&#x27;},
  {nm:&#x27;Mark Jansen&#x27;, av:av(&#x27;M&#x27;), tag:&#x27;&lt;span class=&quot;tag&quot;&gt;Coach&lt;/span&gt;&#x27;, pv:&#x27;See you Monday at 10:00&#x27;, tm:&#x27;Mon&#x27;, un:0, to:&#x27;lesson_chat&#x27;},
  {nm:&#x27;Sunday Padel Crew&#x27;, av:av(&#x27;&#x27;,44,&#x27;#8B5CF6&#x27;,&#x27;people&#x27;), tag:&#x27;&lt;span class=&quot;tag grey&quot;&gt;Group&lt;/span&gt;&#x27;, pv:&#x27;Lotte: Same time next week?&#x27;, tm:&#x27;Sun&#x27;, un:0, to:&#x27;group_chat&#x27;},
  {nm:&#x27;SWP Support&#x27;, av:av(&#x27;&#x27;,44,&#x27;#007AFF&#x27;,&#x27;help-buoy&#x27;), pv:&#x27;Your refund question is resolved&#x27;, tm:&#x27;20 Nov&#x27;, un:0, to:&#x27;support&#x27;},
  {nm:&#x27;Friday Night Padel&#x27;, av:av(&#x27;&#x27;,44,&#x27;#9CA3AF&#x27;,&#x27;lock-closed&#x27;), tag:&#x27;&lt;span class=&quot;tag grey&quot;&gt;Closed&lt;/span&gt;&#x27;, pv:&#x27;Chat closed · messages are saved&#x27;, tm:&#x27;14 Nov&#x27;, un:0, dim:1, to:&#x27;event_chat&#x27;},
];
const convRow = c =&gt; `&lt;div class=&quot;row ${c.dim?&#x27;dim&#x27;:&#x27;&#x27;}&quot; onclick=&quot;go(&#x27;${c.to}&#x27;)&quot; style=&quot;cursor:pointer&quot;&gt;${c.av}&lt;div class=&quot;info&quot;&gt;&lt;div class=&quot;l1&quot;&gt;&lt;div style=&quot;display:flex;gap:6px;align-items:center;min-width:0&quot;&gt;&lt;span class=&quot;nm&quot;&gt;${c.nm}&lt;/span&gt;${c.tag||&#x27;&#x27;}&lt;/div&gt;&lt;span class=&quot;tm&quot;&gt;${c.tm}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;l2&quot;&gt;&lt;span class=&quot;pv ${c.un?&#x27;b&#x27;:&#x27;&#x27;}&quot;&gt;${c.pv}&lt;/span&gt;${c.un?`&lt;span class=&quot;badge&quot;&gt;${c.un}&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;

/* ---------------- screens ---------------- */
const S = {};

S.home_entry = {
  flow:&#x27;Entry &amp; Inbox&#x27;, title:&#x27;Home · Chat Entry&#x27;,
  states:{loading:&#x27;N/A&#x27;, error:&#x27;N/A&#x27;, empty:&#x27;No Unread&#x27;},
  render(st){
    const dot = st===&#x27;empty&#x27; ? &#x27;&#x27; : `&lt;span style=&quot;position:absolute;top:4px;right:3px;min-width:18px;height:18px;border-radius:9px;background:#FF3B30;color:#fff;font:700 11px Lato;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)&quot;&gt;3&lt;/span&gt;`;
    if (st===&#x27;loading&#x27;) return naNote(&#x27;The icon is static. The unread count loads quietly in the background and never blocks the Home screen.&#x27;);
    if (st===&#x27;error&#x27;) return naNote(&#x27;If the unread count fails to load, the icon shows with no badge. Tapping it still opens Messages.&#x27;);
    return `&lt;div class=&quot;hdr&quot; style=&quot;padding:10px 16px&quot;&gt;
        &lt;div style=&quot;display:flex;align-items:center;gap:8px&quot;&gt;&lt;svg width=&quot;34&quot; height=&quot;34&quot; viewBox=&quot;0 0 34 34&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;12&quot; r=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#16A34A&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;22&quot; cy=&quot;12&quot; r=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#007AFF&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;16&quot; cy=&quot;22&quot; r=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#E63900&quot; stroke-width=&quot;3&quot;/&gt;&lt;/svg&gt;&lt;span style=&quot;font:400 23px Lato&quot;&gt;ShallWe-Play&lt;/span&gt;&lt;/div&gt;
        &lt;div style=&quot;display:flex;gap:4px&quot;&gt;&lt;button class=&quot;hbtn&quot; onclick=&quot;go(&#x27;inbox&#x27;)&quot; style=&quot;outline:2px dashed #F59E0B;outline-offset:2px;border-radius:8px&quot;&gt;${ic(&#x27;chatbubbles-outline&#x27;,26)}${dot}&lt;/button&gt;&lt;button class=&quot;hbtn&quot;&gt;${ic(&#x27;notifications-outline&#x27;,26)}&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;body&quot; style=&quot;opacity:.45;pointer-events:none&quot;&gt;
        &lt;div style=&quot;padding:8px 20px&quot;&gt;&lt;div style=&quot;width:72px;height:72px;border-radius:36px;background:#007AFF;color:#fff;display:flex;align-items:center;justify-content:center;font:700 26px Lato&quot;&gt;A&lt;/div&gt;&lt;div style=&quot;font:700 14px Lato;margin:6px 0 0 6px&quot;&gt;My Story&lt;/div&gt;&lt;/div&gt;
        &lt;div style=&quot;margin:14px 16px;background:#fff;border-radius:12px;padding:16px&quot;&gt;&lt;div style=&quot;font:600 18px Montserrat&quot;&gt;WHAT&#x27;S HAPPENING&lt;/div&gt;&lt;div style=&quot;font-size:15px;color:#777;margin-top:4px&quot;&gt;Latest among your teammates &amp; sports clubs around you&lt;/div&gt;&lt;/div&gt;
        &lt;div style=&quot;display:flex;gap:10px;margin:0 16px&quot;&gt;&lt;div style=&quot;flex:1;background:#fff;border-radius:12px;padding:16px&quot;&gt;&lt;b style=&quot;font:800 28px Montserrat&quot;&gt;1036&lt;/b&gt;&lt;div style=&quot;font-size:14px&quot;&gt;Total Open Bookings&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;flex:1;background:#fff;border-radius:12px;padding:16px&quot;&gt;&lt;b style=&quot;font:800 28px Montserrat&quot;&gt;1008&lt;/b&gt;&lt;div style=&quot;font-size:14px&quot;&gt;Coming Soon Clubs&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div style=&quot;margin:14px 16px;background:#fff;border-radius:12px;height:220px&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;`;
  },
  notes:{
    purpose:&#x27;Main entry to Messages. It already exists in the live app (HomeScreen.tsx → &lt;code&gt;ChatScreen&lt;/code&gt;), but today it opens a &quot;Coming Soon&quot; placeholder.&#x27;,
    rules:[&#x27;Keep the existing Ionicons &lt;code&gt;chatbubbles-outline&lt;/code&gt; 26px icon in &lt;code&gt;#007AFF&lt;/code&gt;, to the left of the bell.&#x27;,&#x27;&lt;b&gt;New:&lt;/b&gt; a red count badge with the total number of unread conversations, not messages. Hide it at 0. Show 9+ above 9.&#x27;,&#x27;Tap → Messages inbox (replaces the Coming Soon screen).&#x27;],
    pending:[],
    changed:[&#x27;The old wireframe sent users to chat from a journey tab. Now it starts from the real Home header icon.&#x27;],
    src:[&#x27;HomeScreen.tsx L556-566&#x27;,&#x27;screens/Chat/index.tsx (Coming Soon)&#x27;]
  }
};

S.inbox = {
  flow:&#x27;Entry &amp; Inbox&#x27;, title:&#x27;Messages Inbox&#x27;,
  variants:[&#x27;All&#x27;,&#x27;Activities&#x27;,&#x27;Direct&#x27;,&#x27;Groups&#x27;],
  render(st, v=&#x27;All&#x27;){
    const h = hdr(&#x27;Messages&#x27;, back(&#x27;home_entry&#x27;), `&lt;button class=&quot;hbtn&quot; onclick=&quot;go(&#x27;new_chat&#x27;)&quot;&gt;${ic(&#x27;create-outline&#x27;,24)}&lt;/button&gt;`);
    if (st===&#x27;loading&#x27;) return h + `&lt;div class=&quot;body&quot;&gt;&lt;div class=&quot;search&quot; style=&quot;border-color:var(--border)&quot;&gt;&lt;div class=&quot;sk&quot; style=&quot;height:18px;flex:1&quot;&gt;&lt;/div&gt;&lt;/div&gt;${tabs(this.variants,&#x27;All&#x27;)}${skRows(7)}&lt;/div&gt;`;
    if (st===&#x27;error&#x27;) return h + errBlock(&#x27;Couldn\&#x27;t Load Messages&#x27;,&#x27;Check your internet connection and try again.&#x27;);
    if (st===&#x27;empty&#x27;) return h + center(&#x27;chatbubbles-outline&#x27;,&#x27;No Messages Yet&#x27;,&#x27;Chats with players, clubs and coaches show here. Booking and event chats are added for you automatically.&#x27;, `&lt;button class=&quot;btn p sm&quot; onclick=&quot;go(&#x27;new_chat&#x27;)&quot;&gt;${ic(&#x27;create-outline&#x27;,18)} Start a Chat&lt;/button&gt;`);
    const map = {All:()=&gt;true, Activities:c=&gt;[&#x27;booking_chat&#x27;,&#x27;event_chat&#x27;,&#x27;lesson_chat&#x27;].includes(c.to), Direct:c=&gt;[&#x27;direct_chat&#x27;,&#x27;club_chat&#x27;,&#x27;support&#x27;].includes(c.to), Groups:c=&gt;c.to===&#x27;group_chat&#x27;};
    const list = CONVOS.filter(map[v]);
    return h + `&lt;div class=&quot;body&quot;&gt;${search(&#x27;Search messages&#x27;)}${tabs(this.variants, v)}${list.map(convRow).join(&#x27;&#x27;)}&lt;div style=&quot;height:12px&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
  },
  notes:{
    purpose:&#x27;One list of every conversation, newest first.&#x27;,
    rules:[&#x27;Each row shows: avatar, name, type tag (Booking / Club / Coach / Group / Closed), last message, time and unread count. These are the 4 must-have inbox fields in §3.1.&#x27;,&#x27;Unread rows show the preview in bold. The badge counts unread messages in that chat.&#x27;,&#x27;Tabs reuse the live Bookings segmented control (wrapper &lt;code&gt;#E1EAEA&lt;/code&gt;, active &lt;code&gt;#3B82F6&lt;/code&gt;, 12px text).&#x27;,&#x27;&lt;b&gt;Activities&lt;/b&gt; = booking, event and lesson chats. &lt;b&gt;Direct&lt;/b&gt; = player, club and support chats. &lt;b&gt;Groups&lt;/b&gt; = player-made groups.&#x27;,&#x27;Closed activity chats stay in the list, greyed out with a &lt;b&gt;Closed&lt;/b&gt; tag. Messages are never deleted (§6, retention).&#x27;,&#x27;The ✎ icon opens New Message.&#x27;],
    pending:[&#x27;&lt;b&gt;After the activity&lt;/b&gt; Should closed chats stay in the inbox (shown here) or be hidden after X days?&#x27;],
    changed:[&#x27;Removed: gradient pinned card, online dots, &quot;SafeComm&quot; footer and &quot;Mark all read&quot;. None of these are in release 1.&#x27;,&#x27;Text is now 14–15px (was 10–12px). Colors moved from Tailwind slate to the app tokens.&#x27;],

const LIFE = [&#x27;Active&#x27;,&#x27;Closing Soon&#x27;,&#x27;Closed&#x27;,&#x27;Cancelled&#x27;];
function activityChat(st, v, o){
  const h = chdr(av(&#x27;&#x27;,38,o.color||&#x27;#007AFF&#x27;,o.icon), o.name, o.sub, `&lt;button class=&quot;hbtn&quot; onclick=&quot;go(&#x27;members&#x27;)&quot;&gt;${ic(&#x27;people-outline&#x27;,24)}&lt;/button&gt;`+more(), &#x27;inbox&#x27;);
  const c = ctx(o.ctxIcon, o.ctxTitle, o.ctxSub);
  if (st===&#x27;loading&#x27;) return h + c + skFeed() + comp(&#x27;Message&#x27;);
  if (st===&#x27;error&#x27; &amp;&amp; o.errorGate) return h + c + o.errorGate;
  let banner=&#x27;&#x27;, footer=comp(&#x27;Message&#x27;), extra=&#x27;&#x27;;
  if (v===&#x27;Active&#x27;) banner = ban(&#x27;info&#x27;,&#x27;time-outline&#x27;, o.activeBanner);
  if (v===&#x27;Closing Soon&#x27;) banner = ban(&#x27;warn&#x27;,&#x27;alarm-outline&#x27;,&#x27;This chat closes in &lt;b&gt;45 min&lt;/b&gt;. Messages will stay saved.&#x27;);
  if (v===&#x27;Closed&#x27;) footer = lock(&#x27;This chat is closed&#x27;, `Closed on ${o.closedAt}. You can still read old messages.`);
  if (v===&#x27;Cancelled&#x27;){ extra = sys(o.cancelLine); banner = ban(&#x27;warn&#x27;,&#x27;alert-circle-outline&#x27;, o.cancelBanner); }
  if (st===&#x27;empty&#x27;) return h + c + banner + `&lt;div class=&quot;feed&quot;&gt;${o.createdLines}&lt;div style=&quot;margin:auto;text-align:center;color:var(--text2);font-size:14px;padding:20px&quot;&gt;${ic(&#x27;chatbubbles-outline&#x27;,36,&#x27;color:#BDBDBD&#x27;)}&lt;div style=&quot;margin-top:6px&quot;&gt;No messages yet. Say hi to your group.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;` + footer;
  let msgs = o.msgs;
  if (st===&#x27;error&#x27;) msgs = msgs.replace(&#x27;%LAST%&#x27;, mOut(o.lastOut,&#x27;&#x27;,true)); else msgs = msgs.replace(&#x27;%LAST%&#x27;, mOut(o.lastOut,o.lastTime));
  return h + c + banner + `&lt;div class=&quot;feed&quot;&gt;${o.createdLines}${msgs}${extra}&lt;/div&gt;` + footer;
}

/* ---------------- nav / state ---------------- */
const ORDER = [&#x27;home_entry&#x27;,&#x27;inbox&#x27;,&#x27;new_chat&#x27;,&#x27;direct_chat&#x27;,&#x27;chat_options&#x27;,&#x27;report&#x27;,&#x27;block&#x27;,&#x27;club_profile&#x27;,&#x27;club_chat&#x27;,&#x27;booking_chat&#x27;,&#x27;event_chat&#x27;,&#x27;lesson_chat&#x27;,&#x27;members&#x27;,&#x27;group_create&#x27;,&#x27;group_chat&#x27;,&#x27;support&#x27;,&#x27;media_preview&#x27;,&#x27;notifications&#x27;];
let cur = &#x27;inbox&#x27;, state = &#x27;populated&#x27;, vars = {};
const STATES = [[&#x27;populated&#x27;,&#x27;Populated&#x27;],[&#x27;empty&#x27;,&#x27;Empty&#x27;],[&#x27;loading&#x27;,&#x27;Loading&#x27;],[&#x27;error&#x27;,&#x27;Error&#x27;]];

function go(id){ if(!id||!S[id]) return; cur=id; state=&#x27;populated&#x27;; draw(); }
function setState(s){ state=s; draw(); }
function setVar(v){ vars[cur]=v; draw(); }

function draw(){
  const sc = S[cur];
  // nav
  let html=&#x27;&#x27;, lastFlow=&#x27;&#x27;;
  ORDER.forEach((id,i)=&gt;{ const s=S[id]; if(s.flow!==lastFlow){ html+=`&lt;h4&gt;${s.flow}&lt;/h4&gt;`; lastFlow=s.flow; } html+=`&lt;button class=&quot;${id===cur?&#x27;on&#x27;:&#x27;&#x27;}&quot; onclick=&quot;go(&#x27;${id}&#x27;)&quot;&gt;&lt;span class=&quot;n&quot;&gt;${String(i+1).padStart(2,&#x27;0&#x27;)}&lt;/span&gt;${s.title}&lt;/button&gt;`; });
  document.getElementById(&#x27;nav&#x27;).innerHTML = html;
  // state switch
  document.getElementById(&#x27;switch&#x27;).innerHTML = STATES.map(([k,l])=&gt;{ const o=(sc.states||{})[k]; const na=o===&#x27;N/A&#x27;; return `&lt;button class=&quot;${state===k?&#x27;on&#x27;:&#x27;&#x27;} ${na?&#x27;na&#x27;:&#x27;&#x27;}&quot; onclick=&quot;setState(&#x27;${k}&#x27;)&quot; title=&quot;${na?&#x27;Not applicable for this screen&#x27;:&#x27;&#x27;}&quot;&gt;${na?l:(o||l)}&lt;/button&gt;`; }).join(&#x27;&#x27;);
  // variants
  const v = vars[cur] || (sc.variants?sc.variants[0]:undefined);
  document.getElementById(&#x27;variants&#x27;).innerHTML = sc.variants ? sc.variants.map(x=&gt;`&lt;button class=&quot;${x===v?&#x27;on&#x27;:&#x27;&#x27;}&quot; onclick=&quot;setVar(&#x27;${x.replace(/&#x27;/g,&quot;\\&#x27;&quot;)}&#x27;)&quot;&gt;${x}&lt;/button&gt;`).join(&#x27;&#x27;) : &#x27;&#x27;;
  // screen
  document.getElementById(&#x27;scr&#x27;).innerHTML = sc.render(state, v);
  // notes
  const n = sc.notes;
  const stInfo = STATES.map(([k,l])=&gt;{const o=(sc.states||{})[k]; return `${l}${o&amp;&amp;o!==l?` → &lt;b&gt;${o}&lt;/b&gt;`:&#x27;&#x27;}`}).join(&#x27; · &#x27;);
  document.getElementById(&#x27;notes&#x27;).innerHTML = `
    &lt;div class=&quot;flow&quot;&gt;${sc.flow} · Screen ${String(ORDER.indexOf(cur)+1).padStart(2,&#x27;0&#x27;)}&lt;/div&gt;&lt;h2&gt;${sc.title}&lt;/h2&gt;
    &lt;p&gt;${n.purpose}&lt;/p&gt;
    &lt;h5&gt;4-State Matrix&lt;/h5&gt;&lt;div class=&quot;statebox&quot;&gt;${stInfo}&lt;/div&gt;
    &lt;h5&gt;Rules&lt;/h5&gt;&lt;ul&gt;${n.rules.map(r=&gt;`&lt;li&gt;${r}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;
    ${n.pending.length?`&lt;h5&gt;Pending Client Decisions&lt;/h5&gt;${n.pending.map(p=&gt;`&lt;div class=&quot;pend&quot;&gt;${p}&lt;/div&gt;`).join(&#x27;&#x27;)}`:&#x27;&#x27;}
    &lt;h5&gt;Changed vs v1 Wireframe&lt;/h5&gt;&lt;ul class=&quot;chg&quot;&gt;${n.changed.map(r=&gt;`&lt;li&gt;${r}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;
    &lt;h5&gt;Source&lt;/h5&gt;&lt;ul&gt;${n.src.map(r=&gt;`&lt;li class=&quot;src&quot;&gt;${r}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;`;
}
draw();

&lt;script&gt;
/* ============ helpers ============ */
const ic=(n,s,st=&#x27;&#x27;)=&gt;`&lt;ion-icon name=&quot;${n}&quot; style=&quot;${s?`font-size:${s}px;`:&#x27;&#x27;}${st}&quot;&gt;&lt;/ion-icon&gt;`;
const V=(n,bad)=&gt;`&lt;span class=&quot;v ${bad?&#x27;bad&#x27;:&#x27;&#x27;}&quot;&gt;{{${n}}}&lt;/span&gt;`;
const pill=(t,k=&#x27;ok&#x27;)=&gt;`&lt;span class=&quot;pill ${k}&quot;&gt;${t}&lt;/span&gt;`;
const sk=(w,h=14,mt=0)=&gt;`&lt;div class=&quot;sk&quot; style=&quot;width:${w};height:${h}px;margin-top:${mt}px&quot;&gt;&lt;/div&gt;`;
const emptyBox=(icon,title,text,btn,red)=&gt;`&lt;div class=&quot;empty&quot;&gt;&lt;div class=&quot;ei ${red?&#x27;red&#x27;:&#x27;&#x27;}&quot;&gt;${ic(icon)}&lt;/div&gt;&lt;h4&gt;${title}&lt;/h4&gt;&lt;p&gt;${text}&lt;/p&gt;${btn||&#x27;&#x27;}&lt;/div&gt;`;
const errBox=(t=&#x27;Couldn\u2019t Load Email Templates&#x27;)=&gt;emptyBox(&#x27;cloud-offline-outline&#x27;,t,&#x27;Something went wrong on our side. Try again, and if it keeps happening, contact the tech team.&#x27;,`&lt;button class=&quot;btn n&quot;&gt;${ic(&#x27;refresh&#x27;,16)} Try Again&lt;/button&gt;`,true);
const SWPLOGO=`&lt;svg width=&quot;28&quot; height=&quot;28&quot; viewBox=&quot;0 0 34 34&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;12&quot; r=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#16A34A&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;22&quot; cy=&quot;12&quot; r=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#007AFF&quot; stroke-width=&quot;3&quot;/&gt;&lt;circle cx=&quot;16&quot; cy=&quot;22&quot; r=&quot;8&quot; fill=&quot;none&quot; stroke=&quot;#E63900&quot; stroke-width=&quot;3&quot;/&gt;&lt;/svg&gt;`;

function shell(content, opts={}){
  const sys = opts.menu || &#x27;Email Templates&#x27;;
  const subs=[[&#x27;options-outline&#x27;,&#x27;Master Settings&#x27;],[&#x27;phone-portrait-outline&#x27;,&#x27;App Version&#x27;],[&#x27;mail-outline&#x27;,&#x27;Email Templates&#x27;,1],[&#x27;lock-closed-outline&#x27;,&#x27;Roles and Permissions&#x27;],[&#x27;cloud-download-outline&#x27;,&#x27;Export Data Request&#x27;],[&#x27;person-remove-outline&#x27;,&#x27;Delete Users Requests&#x27;]];
  return `&lt;div class=&quot;app&quot;&gt;&lt;aside class=&quot;side&quot;&gt;
    &lt;div class=&quot;logo&quot;&gt;${SWPLOGO} ShallWe-Play&lt;/div&gt;
    &lt;div class=&quot;mi&quot;&gt;${ic(&#x27;home-outline&#x27;)}Dashboard&lt;/div&gt;
    &lt;div class=&quot;mi&quot;&gt;${ic(&#x27;cash-outline&#x27;)}Financial&lt;ion-icon class=&quot;chev&quot; name=&quot;chevron-forward&quot;&gt;&lt;/ion-icon&gt;&lt;/div&gt;
    &lt;div class=&quot;mi&quot;&gt;${ic(&#x27;person-outline&#x27;)}User Management&lt;ion-icon class=&quot;chev&quot; name=&quot;chevron-forward&quot;&gt;&lt;/ion-icon&gt;&lt;/div&gt;
    &lt;div class=&quot;mi&quot;&gt;${ic(&#x27;megaphone-outline&#x27;)}Marketing&lt;ion-icon class=&quot;chev&quot; name=&quot;chevron-forward&quot;&gt;&lt;/ion-icon&gt;&lt;/div&gt;
    &lt;div class=&quot;mi&quot;&gt;${ic(&#x27;shield-checkmark-outline&#x27;)}Compliance &amp;amp; Sec…&lt;ion-icon class=&quot;chev&quot; name=&quot;chevron-forward&quot;&gt;&lt;/ion-icon&gt;&lt;/div&gt;
    &lt;div class=&quot;mi&quot;&gt;${ic(&#x27;share-social-outline&#x27;)}Social&lt;ion-icon class=&quot;chev&quot; name=&quot;chevron-forward&quot;&gt;&lt;/ion-icon&gt;&lt;/div&gt;
    &lt;div class=&quot;mi open&quot;&gt;${ic(&#x27;settings-outline&#x27;)}System&lt;ion-icon class=&quot;chev&quot; name=&quot;chevron-down&quot;&gt;&lt;/ion-icon&gt;&lt;/div&gt;
    ${subs.map(([i,t,n])=&gt;`&lt;div class=&quot;sub ${t===sys?&#x27;on&#x27;:&#x27;&#x27;}&quot; ${n?&#x27;style=&quot;outline:2px dashed #F59E0B;outline-offset:-2px;border-radius:6px&quot;&#x27;:&#x27;&#x27;}&gt;${ic(i)}${t}${n?&#x27;&lt;span class=&quot;newtag&quot;&gt;NEW&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)}
  &lt;/aside&gt;&lt;div class=&quot;main&quot;&gt;&lt;div class=&quot;topbar&quot;&gt;&lt;span style=&quot;font-size:13px;color:var(--muted)&quot;&gt;Finance Admin&lt;/span&gt;&lt;div class=&quot;me&quot;&gt;FA&lt;/div&gt;&lt;/div&gt;${content}&lt;/div&gt;${opts.overlay||&#x27;&#x27;}&lt;/div&gt;`;
}

/* ============ data (template keys are real, from notification-service) ============ */
const TPL=[
 {n:&#x27;Welcome — Player&#x27;,k:&#x27;user-welcome-player&#x27;,cat:&#x27;Account&#x27;,to:&#x27;Player&#x27;,trg:&#x27;Player finishes sign-up&#x27;,st:[&#x27;New&#x27;,&#x27;new&#x27;],nl:1,ed:&#x27;—&#x27;,hl:1},
 {n:&#x27;Notifications Waiting&#x27;,k:&#x27;notifications-waiting&#x27;,cat:&#x27;Engagement&#x27;,to:&#x27;Player&#x27;,trg:&#x27;More than 5 unread notifications&#x27;,st:[&#x27;New&#x27;,&#x27;new&#x27;],nl:1,ed:&#x27;—&#x27;,hl:1},
 {n:&#x27;Welcome — Club / Coach / Owner&#x27;,k:&#x27;user-welcome&#x27;,cat:&#x27;Account&#x27;,to:&#x27;Club, Coach, Business Owner&#x27;,trg:&#x27;Partner finishes sign-up&#x27;,st:[&#x27;Active&#x27;,&#x27;ok&#x27;],nl:1,ed:&#x27;System default&#x27;},
 {n:&#x27;Verification Code (OTP)&#x27;,k:&#x27;user-requested-otp&#x27;,cat:&#x27;Account&#x27;,to:&#x27;All users&#x27;,trg:&#x27;User requests a login code&#x27;,st:[&#x27;Active&#x27;,&#x27;ok&#x27;],nl:1,ed:&#x27;System default&#x27;,lock:1},
 {n:&#x27;Forgot Password&#x27;,k:&#x27;user-forgot-password&#x27;,cat:&#x27;Account&#x27;,to:&#x27;All users&#x27;,trg:&#x27;User taps Forgot Password&#x27;,st:[&#x27;Active&#x27;,&#x27;ok&#x27;],nl:1,ed:&#x27;System default&#x27;,lock:1},
 {n:&#x27;Booking Confirmation&#x27;,k:&#x27;booking-confirmation&#x27;,cat:&#x27;Bookings&#x27;,to:&#x27;Player&#x27;,trg:&#x27;Booking payment succeeds&#x27;,st:[&#x27;Active&#x27;,&#x27;ok&#x27;],nl:1,ed:&#x27;12 Nov 2026 · Finance Admin&#x27;},
 {n:&#x27;Booking Cancelled&#x27;,k:&#x27;booking-cancelled&#x27;,cat:&#x27;Bookings&#x27;,to:&#x27;Player&#x27;,trg:&#x27;Booking is cancelled&#x27;,st:[&#x27;Draft changes&#x27;,&#x27;draft&#x27;],nl:0,ed:&#x27;25 Nov 2026 · Finance Admin&#x27;},
 {n:&#x27;New Booking Alert&#x27;,k:&#x27;new-booking-alert&#x27;,cat:&#x27;Bookings&#x27;,to:&#x27;Club&#x27;,trg:&#x27;Player books a club asset&#x27;,st:[&#x27;Active&#x27;,&#x27;ok&#x27;],nl:1,ed:&#x27;System default&#x27;},
 {n:&#x27;Refund Processed&#x27;,k:&#x27;refund-processed&#x27;,cat:&#x27;Payments&#x27;,to:&#x27;Player&#x27;,trg:&#x27;Revolut refund webhook: success&#x27;,st:[&#x27;Active&#x27;,&#x27;ok&#x27;],nl:1,ed:&#x27;System default&#x27;},
 {n:&#x27;KYC Pending Reminder&#x27;,k:&#x27;club-kyc-pending-alert&#x27;,cat:&#x27;Club Finance&#x27;,to:&#x27;Club&#x27;,trg:&#x27;Payout due, KYC not complete&#x27;,st:[&#x27;Active&#x27;,&#x27;ok&#x27;],nl:1,ed:&#x27;System default&#x27;},
];

/* ============ screens ============ */
const S={};

S.overview={grp:&#x27;Overview&#x27;,t:&#x27;Features &amp; Flow Map&#x27;,url:&#x27;—&#x27;,states:{empty:&#x27;N/A&#x27;,loading:&#x27;N/A&#x27;,error:&#x27;N/A&#x27;},
 render(st){
  if(st!==&#x27;populated&#x27;) return `&lt;div style=&quot;padding:60px;text-align:center;color:var(--muted)&quot;&gt;This is a planning page, not a product screen. It has no states.&lt;/div&gt;`;
  const F=[
   [&#x27;F1&#x27;,&#x27;Email Templates list&#x27;,&#x27;See all 53 emails, who gets them, when they\u2019re sent, and their status.&#x27;,&#x27;New&#x27;],
   [&#x27;F2&#x27;,&#x27;Content editor&#x27;,&#x27;Edit subject, preheader and body in EN and NL. Insert variables. Live preview.&#x27;,&#x27;New&#x27;],
   [&#x27;F3&#x27;,&#x27;Test, publish &amp; history&#x27;,&#x27;Send a test to yourself. Publish with a confirm step. Restore older versions.&#x27;,&#x27;New&#x27;],
   [&#x27;F4&#x27;,&#x27;Player Welcome email&#x27;,&#x27;A separate welcome for players that lists what they can do on SWP.&#x27;,&#x27;New template&#x27;],
   [&#x27;F5&#x27;,&#x27;Notifications Waiting email&#x27;,&#x27;Email a player when they have more than 5 unread notifications.&#x27;,&#x27;New template + job&#x27;],
   [&#x27;F6&#x27;,&#x27;Sending rules&#x27;,&#x27;Admin sets the threshold, check time and how often the digest can repeat.&#x27;,&#x27;New&#x27;],
   [&#x27;F7&#x27;,&#x27;Permission&#x27;,&#x27;New &quot;Email Templates&quot; row in Roles and Permissions: View / Edit / Publish.&#x27;,&#x27;Change&#x27;],
   [&#x27;F8&#x27;,&#x27;Locked layout&#x27;,&#x27;SWP header, footer and legal links stay fixed. Admins can\u2019t break the layout.&#x27;,&#x27;Rule&#x27;],
  ];
  const box=(n,t,go,cls=&#x27;&#x27;)=&gt;`&lt;div class=&quot;box ${cls}&quot; ${go?`onclick=&quot;goTo(&#x27;${go}&#x27;)&quot;`:&#x27;&#x27;}&gt;&lt;b&gt;${n}&lt;/b&gt;${t}&lt;/div&gt;`;
  const A=`&lt;div class=&quot;arr&quot;&gt;→&lt;/div&gt;`;
  return `&lt;div style=&quot;background:var(--canvas);padding:28px;min-height:820px&quot;&gt;
   &lt;div class=&quot;ph&quot;&gt;&lt;div&gt;&lt;h3&gt;What We\u2019re Building&lt;/h3&gt;&lt;p&gt;8 features · 11 screens · Release 1&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;

S.list={grp:&#x27;Flow A&#x27;,t:&#x27;Email Templates List&#x27;,url:&#x27;test.admin.shallwe-play.com/email-templates/&#x27;,

 render(st,v=&#x27;All&#x27;){
  const head=`&lt;div class=&quot;ph&quot;&gt;&lt;div&gt;&lt;h3&gt;Email Templates&lt;/h3&gt;&lt;p&gt;Manage the emails ShallWe-Play sends to players, clubs, coaches and admins&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`;

  const filt=(q)=&gt;`&lt;div class=&quot;filters&quot;&gt;&lt;div class=&quot;srch&quot;&gt;${ic(&#x27;search&#x27;,16)}&lt;span ${q?&#x27;style=&quot;color:var(--ink)&quot;&#x27;:&#x27;&#x27;}&gt;${q||&#x27;Search by name or key&#x27;}&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;sel&quot;&gt;&lt;label&gt;Category&lt;/label&gt;All Categories ${ic(&#x27;chevron-down&#x27;,14)}&lt;/div&gt;
   &lt;div class=&quot;sel&quot;&gt;&lt;label&gt;Recipient&lt;/label&gt;${v===&#x27;Filtered: Player&#x27;?&#x27;Player&#x27;:&#x27;All Recipients&#x27;} ${ic(&#x27;chevron-down&#x27;,14)}&lt;/div&gt;
   &lt;div class=&quot;sel&quot;&gt;&lt;label&gt;Status&lt;/label&gt;All Status ${ic(&#x27;chevron-down&#x27;,14)}&lt;/div&gt;&lt;/div&gt;`;
  if(st===&#x27;error&#x27;) return shell(head+kpis+`&lt;div class=&quot;card&quot;&gt;${filt()}${errBox()}&lt;/div&gt;`);
  if(st===&#x27;loading&#x27;) return shell(head+kpis+`&lt;div class=&quot;card&quot;&gt;${filt()}&lt;table&gt;&lt;tr&gt;&lt;th&gt;Template&lt;/th&gt;&lt;th&gt;Category&lt;/th&gt;&lt;th&gt;Recipient&lt;/th&gt;&lt;th&gt;Sent When&lt;/th&gt;&lt;th&gt;Languages&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Last Edited&lt;/th&gt;&lt;th&gt;Actions&lt;/th&gt;&lt;/tr&gt;${[1,2,3,4,5,6].map(()=&gt;`&lt;tr&gt;${[70,40,40,80,30,35,50,20].map(w=&gt;`&lt;td&gt;${sk(w+&#x27;%&#x27;)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/table&gt;&lt;/div&gt;`);
  if(st===&#x27;empty&#x27;||v===&#x27;Search: no results&#x27;) return shell(head+kpis+`&lt;div class=&quot;card&quot;&gt;${filt(&#x27;refnd&#x27;)}${emptyBox(&#x27;search-outline&#x27;,&#x27;No Templates Found&#x27;,&#x27;No template matches \u201crefnd\u201d. Check the spelling or clear the filters.&#x27;,`&lt;button class=&quot;btn n&quot;&gt;Clear Filters&lt;/button&gt;`)}&lt;/div&gt;`);
  let rows=TPL; if(v===&#x27;Filtered: Player&#x27;) rows=TPL.filter(r=&gt;r.to===&#x27;Player&#x27;);
  return shell(head+kpis+`&lt;div class=&quot;card&quot;&gt;${filt()}&lt;table&gt;
   &lt;tr&gt;&lt;th&gt;Template&lt;/th&gt;&lt;th&gt;Category&lt;/th&gt;&lt;th&gt;Recipient&lt;/th&gt;&lt;th&gt;Sent When&lt;/th&gt;&lt;th&gt;Languages&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Last Edited&lt;/th&gt;&lt;th&gt;Actions&lt;/th&gt;&lt;/tr&gt;
   ${rows.map(r=&gt;`&lt;tr class=&quot;${r.hl?&#x27;hl&#x27;:&#x27;&#x27;}&quot; style=&quot;cursor:pointer&quot; onclick=&quot;goTo(&#x27;detail&#x27;)&quot;&gt;&lt;td&gt;&lt;div class=&quot;tn&quot;&gt;${r.n}${r.lock?ic(&#x27;lock-closed&#x27;,13,&#x27;color:#9AA5B1&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;tk&quot;&gt;${r.k}&lt;/div&gt;&lt;/td&gt;&lt;td&gt;${r.cat}&lt;/td&gt;&lt;td&gt;${r.to}&lt;/td&gt;&lt;td style=&quot;max-width:200px&quot;&gt;${r.trg}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;lang&quot;&gt;&lt;span&gt;EN&lt;/span&gt;&lt;span class=&quot;${r.nl?&#x27;&#x27;:&#x27;miss&#x27;}&quot;&gt;NL&lt;/span&gt;&lt;/span&gt;&lt;/td&gt;&lt;td&gt;${pill(...r.st)}&lt;/td&gt;&lt;td style=&quot;font-size:13px&quot;&gt;${r.ed}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;act&quot;&gt;${ic(&#x27;eye-outline&#x27;)}&lt;/span&gt;&lt;span class=&quot;act&quot; style=&quot;color:var(--primary)&quot;&gt;${ic(&#x27;create-outline&#x27;)}&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}
   &lt;/table&gt;&lt;div class=&quot;pager&quot;&gt;&lt;span&gt;Rows per page &lt;b&gt;10&lt;/b&gt; · Showing 1 to ${rows.length} of ${v===&#x27;Filtered: Player&#x27;?rows.length:55} entries&lt;/span&gt;&lt;div class=&quot;pg&quot;&gt;&lt;span&gt;${ic(&#x27;chevron-back&#x27;)}&lt;/span&gt;&lt;span class=&quot;on&quot;&gt;1&lt;/span&gt;&lt;span&gt;2&lt;/span&gt;&lt;span&gt;…&lt;/span&gt;&lt;span&gt;6&lt;/span&gt;&lt;span&gt;${ic(&#x27;chevron-forward&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`);
 },
 notes:{
  what:`Entry point. Every email SWP sends, in one table. Click a row to open it.`,

 }};

S.detail={grp:&#x27;Flow A&#x27;,t:&#x27;Template Details&#x27;,url:&#x27;test.admin.shallwe-play.com/email-templates/user-welcome-player/&#x27;,

  if(st===&#x27;loading&#x27;) return shell(crumb+`&lt;div class=&quot;grid2&quot;&gt;&lt;div class=&quot;card cb&quot;&gt;${sk(&#x27;40%&#x27;,18)}${[1,2,3,4,5].map(()=&gt;sk(&#x27;90%&#x27;,14,14)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;card cb&quot;&gt;${sk(&#x27;100%&#x27;,360)}&lt;/div&gt;&lt;/div&gt;`);
  if(st===&#x27;error&#x27;) return shell(crumb+`&lt;div class=&quot;card&quot;&gt;${emptyBox(&#x27;alert-circle-outline&#x27;,&#x27;Template Not Found&#x27;,&#x27;This template may have been removed or the link is wrong.&#x27;,`&lt;button class=&quot;btn n&quot;&gt;Back to Email Templates&lt;/button&gt;`,true)}&lt;/div&gt;`);

  return shell(crumb+`&lt;div class=&quot;grid2&quot; style=&quot;grid-template-columns:1fr 1.15fr&quot;&gt;
   &lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;Template Information&lt;span class=&quot;act&quot;&gt;${ic(&#x27;ellipsis-vertical&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;dl class=&quot;kv&quot;&gt;${info.map(([a,b])=&gt;`&lt;dt&gt;${a}&lt;/dt&gt;&lt;dd&gt;${b}&lt;/dd&gt;`).join(&#x27;&#x27;)}&lt;/dl&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;Available Variables&lt;/div&gt;&lt;div class=&quot;cb&quot; style=&quot;display:flex;flex-wrap:wrap;gap:6px&quot;&gt;${(dg?[&#x27;firstName&#x27;,&#x27;unreadCount&#x27;,&#x27;notificationList&#x27;,&#x27;notificationsLink&#x27;]:[&#x27;firstName&#x27;,&#x27;appLink&#x27;,&#x27;supportEmail&#x27;]).map(x=&gt;V(x)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;
    ${dg?`&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;Sending Rules&lt;button class=&quot;btn t sm&quot; onclick=&quot;goTo(&#x27;rules&#x27;)&quot;&gt;Edit Rules&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;cb&quot; style=&quot;font-size:14px;line-height:1.7;color:var(--ink)&quot;&gt;More than &lt;b&gt;5&lt;/b&gt; unread · checked &lt;b&gt;daily at 09:00&lt;/b&gt; · max once every &lt;b&gt;7 days&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;`:&#x27;&#x27;}
    &lt;div style=&quot;display:flex;gap:10px&quot;&gt;&lt;button class=&quot;btn p&quot; onclick=&quot;goTo(&#x27;edit&#x27;)&quot;&gt;${ic(&#x27;create-outline&#x27;,16)} Edit Content&lt;/button&gt;&lt;button class=&quot;btn n&quot; onclick=&quot;goTo(&#x27;history&#x27;)&quot;&gt;${ic(&#x27;time-outline&#x27;,16)} Version History&lt;/button&gt;&lt;/div&gt;

function mailWelcome(size, lang=&#x27;EN&#x27;){
  const w=size===&#x27;sm&#x27;?&#x27;100%&#x27;:size===&#x27;mobile&#x27;?&#x27;360px&#x27;:&#x27;560px&#x27;;
  const nl=lang===&#x27;NL&#x27;;
  const feats=nl?[[&#x27;tennisball-outline&#x27;,&#x27;Boek een baan&#x27;,&#x27;Vind clubs bij jou in de buurt en boek in een paar tikken.&#x27;],[&#x27;people-outline&#x27;,&#x27;Speel een Open SWP&#x27;,&#x27;Maak een potje aan of doe mee met spelers op jouw niveau.&#x27;],[&#x27;card-outline&#x27;,&#x27;Word lid van een club&#x27;,&#x27;Koop lidmaatschappen direct in de app.&#x27;],[&#x27;qr-code-outline&#x27;,&#x27;Inchecken met QR&#x27;,&#x27;Scan de code op de baan om in te checken.&#x27;],[&#x27;images-outline&#x27;,&#x27;Volg spelers&#x27;,&#x27;Deel foto\u2019s en video\u2019s van je wedstrijden.&#x27;]]
   :[[&#x27;tennisball-outline&#x27;,&#x27;Book a court&#x27;,&#x27;Find clubs near you and book in a few taps.&#x27;],[&#x27;people-outline&#x27;,&#x27;Play an Open SWP&#x27;,&#x27;Create a game or join players at your level.&#x27;],[&#x27;card-outline&#x27;,&#x27;Join a club&#x27;,&#x27;Buy club memberships right in the app.&#x27;],[&#x27;qr-code-outline&#x27;,&#x27;Check in with QR&#x27;,&#x27;Scan the code at the court to check in.&#x27;],[&#x27;images-outline&#x27;,&#x27;Follow players&#x27;,&#x27;Share photos and videos from your games.&#x27;]];
  return `&lt;div class=&quot;mail&quot; style=&quot;max-width:${w}&quot;&gt;&lt;div class=&quot;mh&quot;&gt;${SWPLOGO}&lt;div style=&quot;font-weight:700;font-size:15px;color:var(--ink);margin-top:2px&quot;&gt;ShallWe-Play&lt;/div&gt;&lt;span class=&quot;lockico&quot;&gt;${ic(&#x27;lock-closed&#x27;)}&lt;/span&gt;&lt;/div&gt;
   &lt;div class=&quot;mb&quot;&gt;&lt;h2&gt;${nl?&#x27;Welkom bij ShallWe-Play, Alex!&#x27;:&#x27;Welcome to ShallWe-Play, Alex!&#x27;}&lt;/h2&gt;

  const m=`&lt;div class=&quot;ov c&quot;&gt;&lt;div class=&quot;modal&quot;&gt;&lt;div class=&quot;mhd&quot;&gt;Publish Changes?&lt;span class=&quot;act&quot;&gt;${ic(&#x27;close&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mbd&quot;&gt;
   &lt;p style=&quot;margin-bottom:10px&quot;&gt;&lt;b style=&quot;color:var(--ink)&quot;&gt;Welcome — Player&lt;/b&gt; will be sent with this content from now on, in English and Dutch.&lt;/p&gt;
   &lt;ul style=&quot;padding-left:18px;font-size:13.5px;color:var(--muted);line-height:1.7&quot;&gt;&lt;li&gt;Emails already sent don\u2019t change.&lt;/li&gt;&lt;li&gt;The previous version is kept in Version History.&lt;/li&gt;&lt;/ul&gt;
   ${st===&#x27;error&#x27;?`&lt;div style=&quot;margin-top:12px;background:var(--err-bg);color:var(--err);border-radius:6px;padding:10px 12px;font-size:13px&quot;&gt;Couldn\u2019t publish. Your draft is saved. Try again.&lt;/div&gt;`:&#x27;&#x27;}
   &lt;/div&gt;&lt;div class=&quot;mft&quot;&gt;&lt;button class=&quot;btn n&quot;&gt;Cancel&lt;/button&gt;&lt;button class=&quot;btn p ${st===&#x27;loading&#x27;?&#x27;off&#x27;:&#x27;&#x27;}&quot;&gt;${st===&#x27;loading&#x27;?ic(&#x27;sync&#x27;,16)+&#x27; Publishing…&#x27;:st===&#x27;error&#x27;?&#x27;Try Again&#x27;:&#x27;Publish&#x27;}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
  return base.replace(/&lt;\/div&gt;$/, m+&#x27;&lt;/div&gt;&#x27;);
 },
 notes:{
  what:`Confirm step before changes go live, then a success toast on the details page.`,
  rules:[`Publish is only possible when both languages pass validation.`,`After publishing: status becomes Active, Live version shows the version number, date and admin.`,`Sent emails are never changed (no retro-updates).`,`Error: the draft is kept, so nothing is lost.`],
  pending:[`Should publishing a security email (OTP, password reset) need super-admin approval?`],
  dev:[`Store each publish as a new version row: template key, language, subject, preheader, body, published by, published at.`]
 }};

S.history={grp:&#x27;Flow A&#x27;,t:&#x27;Version History&#x27;,url:&#x27;test.admin.shallwe-play.com/email-templates/booking-cancelled/&#x27;,
 variants:[&#x27;History&#x27;,&#x27;Restore Confirm&#x27;],
 states:{empty:&#x27;Only Default&#x27;},
 render(st,v=&#x27;History&#x27;){
  const base=S.detail.render(&#x27;populated&#x27;,&#x27;Welcome — Player&#x27;).replace(/Welcome — Player/g,&#x27;Booking Cancelled&#x27;).replace(&#x27;user-welcome-player&#x27;,&#x27;booking-cancelled&#x27;);
  let list;
  if(st===&#x27;loading&#x27;) list=[1,2,3].map(()=&gt;`&lt;div class=&quot;ver&quot;&gt;&lt;div class=&quot;vd&quot;&gt;&lt;/div&gt;&lt;div style=&quot;flex:1&quot;&gt;${sk(&#x27;50%&#x27;)}${sk(&#x27;70%&#x27;,12,6)}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  else if(st===&#x27;error&#x27;) list=errBox(&#x27;Couldn\u2019t Load History&#x27;);
  else if(st===&#x27;empty&#x27;) list=`&lt;div class=&quot;ver cur&quot;&gt;&lt;div class=&quot;vd&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;System default&lt;/b&gt; ${pill(&#x27;Live&#x27;,&#x27;ok&#x27;)}&lt;div class=&quot;vm&quot;&gt;Original version from the developers&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;padding:20px;font-size:13px;color:var(--muted)&quot;&gt;No admin edits yet. When someone publishes a change, it shows here.&lt;/div&gt;`;
  else list=`
   &lt;div class=&quot;ver drf&quot;&gt;&lt;div class=&quot;vd&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;Draft&lt;/b&gt; ${pill(&#x27;Not live&#x27;,&#x27;draft&#x27;)}&lt;div class=&quot;vm&quot;&gt;25 Nov 2026, 16:05 · Finance Admin&lt;/div&gt;&lt;div class=&quot;vm&quot;&gt;Changed: Dutch subject, body&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;va&quot;&gt;&lt;button class=&quot;btn t sm&quot;&gt;Open&lt;/button&gt;&lt;button class=&quot;btn t sm&quot; style=&quot;color:var(--destroy)&quot;&gt;Discard&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ver cur&quot;&gt;&lt;div class=&quot;vd&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;v3&lt;/b&gt; ${pill(&#x27;Live&#x27;,&#x27;ok&#x27;)}&lt;div class=&quot;vm&quot;&gt;12 Nov 2026, 10:20 · Finance Admin&lt;/div&gt;&lt;div class=&quot;vm&quot;&gt;Changed: refund wording&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;va&quot;&gt;&lt;button class=&quot;btn t sm&quot;&gt;View&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ver&quot;&gt;&lt;div class=&quot;vd&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;v2&lt;/b&gt;&lt;div class=&quot;vm&quot;&gt;3 Oct 2026, 09:14 · Super Admin&lt;/div&gt;&lt;div class=&quot;vm&quot;&gt;Changed: subject&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;va&quot;&gt;&lt;button class=&quot;btn t sm&quot;&gt;View&lt;/button&gt;&lt;button class=&quot;btn t sm&quot;&gt;Restore&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;div class=&quot;ver&quot;&gt;&lt;div class=&quot;vd&quot;&gt;&lt;/div&gt;&lt;div&gt;&lt;b&gt;v1 · System default&lt;/b&gt;&lt;div class=&quot;vm&quot;&gt;Original from the developers&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;va&quot;&gt;&lt;button class=&quot;btn t sm&quot;&gt;View&lt;/button&gt;&lt;button class=&quot;btn t sm&quot;&gt;Restore&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
  const drawer=`&lt;div class=&quot;ov r&quot;&gt;&lt;div class=&quot;drawer&quot;&gt;&lt;div class=&quot;mhd&quot;&gt;Version History&lt;span class=&quot;act&quot;&gt;${ic(&#x27;close&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;overflow:auto;flex:1&quot;&gt;${list}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
  const modal=`&lt;div class=&quot;ov c&quot;&gt;&lt;div class=&quot;modal&quot;&gt;&lt;div class=&quot;mhd&quot;&gt;Restore v2?&lt;span class=&quot;act&quot;&gt;${ic(&#x27;close&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mbd&quot;&gt;v2 will be copied into a new draft. Nothing goes live until you publish it. Your current draft will be replaced.&lt;/div&gt;&lt;div class=&quot;mft&quot;&gt;&lt;button class=&quot;btn n&quot;&gt;Cancel&lt;/button&gt;&lt;button class=&quot;btn p&quot;&gt;Restore to Draft&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
  return base.replace(/&lt;\/div&gt;$/, (v===&#x27;Restore Confirm&#x27;&amp;&amp;st===&#x27;populated&#x27;?modal:drawer)+&#x27;&lt;/div&gt;&#x27;);
 },
 notes:{
  what:`Right-side drawer with every saved version. Admins can view or restore older text.`,
  rules:[`Newest first: Draft (amber) → Live (green) → older versions → v1 System default.`,`Each row: version, date and time, admin, what changed.`,`&lt;b&gt;Restore&lt;/b&gt; copies the old version into a new draft. It never goes live directly. The admin still publishes.`,`System default is always available, so an admin can undo every change.`],
  pending:[`How long do we keep old versions? Recommended: forever (they\u2019re small).`],
  dev:[`&quot;What changed&quot; can be generated by comparing fields (subject / preheader / body / language).`]
 }};

S.rules={grp:&#x27;Flow B&#x27;,t:&#x27;Notifications Waiting · Sending Rules&#x27;,url:&#x27;test.admin.shallwe-play.com/email-templates/notifications-waiting/rules/&#x27;,
 states:{empty:&#x27;N/A&#x27;,error:&#x27;Validation&#x27;},
 render(st){
  const crumb=`&lt;div class=&quot;crumb&quot;&gt;${ic(&#x27;chevron-back&#x27;,16)} Email Templates / Notifications Waiting / &lt;b&gt;Sending Rules&lt;/b&gt;&lt;/div&gt;`;

  const bad=st===&#x27;error&#x27;;
  const r=(l,s,ctrl)=&gt;`&lt;div class=&quot;rule&quot;&gt;&lt;div class=&quot;rl&quot;&gt;${l}&lt;small&gt;${s}&lt;/small&gt;&lt;/div&gt;${ctrl}&lt;/div&gt;`;
  return shell(crumb+`&lt;div class=&quot;grid2&quot; style=&quot;grid-template-columns:1.2fr 1fr&quot;&gt;
   &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;Sending Rules&lt;/div&gt;&lt;div class=&quot;cb&quot; style=&quot;padding-top:4px&quot;&gt;
    ${r(&#x27;Send this email&#x27;,&#x27;When off, no player gets it. Saved rules are kept.&#x27;,&#x27;&lt;span class=&quot;sw on&quot;&gt;&lt;/span&gt;&#x27;)}
    ${r(&#x27;Send when unread notifications are more than&#x27;,&#x27;Counts only unread notifications from the last 14 days.&#x27;,`&lt;div class=&quot;numin ${bad?&#x27;bad&#x27;:&#x27;&#x27;}&quot;&gt;${bad?&#x27;0&#x27;:&#x27;5&#x27;}&lt;span style=&quot;display:flex;flex-direction:column;font-size:11px&quot;&gt;${ic(&#x27;chevron-up&#x27;)}${ic(&#x27;chevron-down&#x27;)}&lt;/span&gt;&lt;/div&gt;`)}
    ${bad?`&lt;div class=&quot;hint bad&quot; style=&quot;justify-content:flex-end&quot;&gt;&lt;span&gt;Enter a number from 1 to 50.&lt;/span&gt;&lt;/div&gt;`:&#x27;&#x27;}
    ${r(&#x27;Check every day at&#x27;,&#x27;Time in Europe/Amsterdam.&#x27;,&#x27;&lt;div class=&quot;sel&quot; style=&quot;min-width:120px&quot;&gt;09:00 &#x27;+ic(&#x27;chevron-down&#x27;,14)+&#x27;&lt;/div&gt;&#x27;)}
    ${r(&#x27;Don\u2019t send again within&#x27;,&#x27;Stops repeat emails if the player still hasn\u2019t opened the app.&#x27;,`&lt;div class=&quot;sel ${bad?&#x27;&#x27;:&#x27;&#x27;}&quot; style=&quot;min-width:120px&quot;&gt;7 days ${ic(&#x27;chevron-down&#x27;,14)}&lt;/div&gt;`)}
    ${r(&#x27;Show in the email&#x27;,&#x27;Latest unread notifications listed in the email.&#x27;,&#x27;&lt;div class=&quot;sel&quot; style=&quot;min-width:120px&quot;&gt;3 items &#x27;+ic(&#x27;chevron-down&#x27;,14)+&#x27;&lt;/div&gt;&#x27;)}
    &lt;div style=&quot;display:flex;justify-content:flex-end;gap:10px;margin-top:16px&quot;&gt;&lt;button class=&quot;btn n&quot;&gt;Cancel&lt;/button&gt;&lt;button class=&quot;btn p ${bad?&#x27;off&#x27;:&#x27;&#x27;}&quot;&gt;Save Rules&lt;/button&gt;&lt;/div&gt;
   &lt;/div&gt;&lt;/div&gt;
   &lt;div style=&quot;display:flex;flex-direction:column;gap:16px&quot;&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;Summary&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;div class=&quot;summary&quot;&gt;${ic(&#x27;information-circle&#x27;,20,&#x27;color:#007AFF;flex-shrink:0&#x27;)}&lt;span&gt;${bad?&#x27;Fix the highlighted field to see the summary.&#x27;:&#x27;Every day at &lt;b&gt;09:00&lt;/b&gt;, players with &lt;b&gt;6 or more&lt;/b&gt; unread notifications get this email. A player gets it &lt;b&gt;at most once every 7 days&lt;/b&gt;.&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;ch&quot;&gt;Last 7 Days&lt;/div&gt;&lt;div class=&quot;cb&quot;&gt;&lt;dl class=&quot;kv&quot;&gt;&lt;dt&gt;Emails sent&lt;/dt&gt;&lt;dd&gt;214&lt;/dd&gt;&lt;dt&gt;Opened the app after&lt;/dt&gt;&lt;dd&gt;38%&lt;/dd&gt;&lt;dt&gt;Turned off&lt;/dt&gt;&lt;dd&gt;3 players&lt;/dd&gt;&lt;/dl&gt;&lt;div style=&quot;font-size:12px;color:var(--muted);margin-top:10px&quot;&gt;Sample numbers. Shown after the first run.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
   &lt;/div&gt;&lt;/div&gt;`);
 },
 notes:{
  what:`Settings for the new &quot;more than 5 notifications&quot; email (F5, F6).`,
  rules:[`Defaults: on · more than &lt;b&gt;5&lt;/b&gt; unread · daily at &lt;b&gt;09:00&lt;/b&gt; · max once every &lt;b&gt;7 days&lt;/b&gt; · show 3 items.`,`Threshold must be 1–50. Save is disabled while a field is invalid.`,`The summary rewrites the rules as a sentence, so admins can check they\u2019re right.`,`Only unread notifications from the last 14 days count. Old ones don\u2019t trigger emails forever.`],
  pending:[`&quot;More than 5&quot; = 6 or more? (Assumed yes.)`,`Can players turn this email off? Recommended yes: a link in the email + a toggle in the app\u2019s notification settings.`,`Should the 7-day cooldown reset once the player opens the app?`],
  dev:[`&lt;code&gt;UserNotification.is_read&lt;/code&gt; already exists, so the unread count is easy.`,`New: a daily scheduled job (none exists in notification-service today) + a &quot;last digest sent at&quot; field per player for the cooldown.`]
 }};

   &lt;table class=&quot;perm&quot;&gt;&lt;tr&gt;&lt;th&gt;Module Type&lt;/th&gt;${cols.map(c=&gt;`&lt;th style=&quot;text-align:center&quot;&gt;${c}&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;

 render(st,v=&#x27;Desktop&#x27;){
  if(st!==&#x27;populated&#x27;) return client(&#x27;d&#x27;,`&lt;div style=&quot;padding:80px;text-align:center;color:var(--muted)&quot;&gt;Not applicable. This is a received email.&lt;/div&gt;`);
  return client(&#x27;d&#x27;,`&lt;div style=&quot;font-size:13px;color:var(--muted);margin:0 auto 10px;max-width:560px&quot;&gt;&lt;b style=&quot;color:var(--ink)&quot;&gt;You have 7 notifications waiting&lt;/b&gt;&lt;br&gt;From: ShallWe-Play &amp;lt;no-reply@shallweplay.nl&amp;gt;&lt;/div&gt;`+mailDigest(v===&#x27;Mobile&#x27;?&#x27;mobile&#x27;:&#x27;desktop&#x27;));
 },
 notes:{
  what:`The email a player gets when they have more than 5 unread notifications (F5).`,
  rules:[`Subject shows the real count.`,`Lists the latest 3 unread notifications (title + time), then &quot;+ N more&quot;.`,`CTA &quot;View Notifications&quot; opens the app\u2019s notification list.`,`Footer explains why they got it, with a link to turn these emails off.`],
  pending:[`Should the list show notification titles at all? Some may include private details (payments, names). Alternative: show the count only.`],
  dev:[`Notification titles come from &lt;code&gt;UserNotification.title&lt;/code&gt; / &lt;code&gt;message&lt;/code&gt;.`]
 }};

/* ============ flow + state engine ============ */
const ORDER=[&#x27;overview&#x27;,&#x27;list&#x27;,&#x27;detail&#x27;,&#x27;edit&#x27;,&#x27;variables&#x27;,&#x27;test&#x27;,&#x27;publish&#x27;,&#x27;history&#x27;,&#x27;rules&#x27;,&#x27;perms&#x27;,&#x27;mail_welcome&#x27;,&#x27;mail_digest&#x27;];
const STATES=[[&#x27;populated&#x27;,&#x27;Populated&#x27;],[&#x27;empty&#x27;,&#x27;Empty&#x27;],[&#x27;loading&#x27;,&#x27;Loading&#x27;],[&#x27;error&#x27;,&#x27;Error&#x27;]];
let cur=&#x27;overview&#x27;, state=&#x27;populated&#x27;, vars={};
function goTo(id){ if(!S[id])return; cur=id; state=&#x27;populated&#x27;; draw(); window.scrollTo({top:0,behavior:&#x27;smooth&#x27;}); }
function step(d){ const i=ORDER.indexOf(cur)+d; if(i&gt;=0&amp;&amp;i&lt;ORDER.length) goTo(ORDER[i]); }
function setState(s){ state=s; draw(); }
function setVar(v){ vars[cur]=v; draw(); }
function fit(){ const w=document.getElementById(&#x27;fitwrap&#x27;).clientWidth; const z=Math.min(1,w/1280); const f=document.getElementById(&#x27;fit&#x27;); f.style.transform=`scale(${z})`; document.getElementById(&#x27;fitwrap&#x27;).style.height=(f.scrollHeight*z)+&#x27;px&#x27;; }
function draw(){
  const sc=S[cur], idx=ORDER.indexOf(cur);
  let fb=&#x27;&#x27;, lg=&#x27;&#x27;;
  ORDER.forEach((id,i)=&gt;{ const s=S[id]; if(s.grp!==lg){ fb+=`&lt;span class=&quot;fgrp&quot;&gt;${s.grp}&lt;/span&gt;`; lg=s.grp; } else fb+=`&lt;span class=&quot;fsep&quot;&gt;›&lt;/span&gt;`; fb+=`&lt;button class=&quot;fstep ${id===cur?&#x27;on&#x27;:&#x27;&#x27;} ${i&lt;idx?&#x27;done&#x27;:&#x27;&#x27;}&quot; onclick=&quot;goTo(&#x27;${id}&#x27;)&quot;&gt;&lt;span class=&quot;num&quot;&gt;${i}&lt;/span&gt;${s.t}&lt;/button&gt;`; });
  document.getElementById(&#x27;flowbar&#x27;).innerHTML=fb;
  document.getElementById(&#x27;stitle&#x27;).innerHTML=`&lt;span&gt;Step ${idx}&lt;/span&gt; · ${sc.t}`;
  document.getElementById(&#x27;states&#x27;).innerHTML=STATES.map(([k,l])=&gt;{const o=(sc.states||{})[k];const na=o===&#x27;N/A&#x27;;return `&lt;button class=&quot;${state===k?&#x27;on&#x27;:&#x27;&#x27;} ${na?&#x27;na&#x27;:&#x27;&#x27;}&quot; onclick=&quot;setState(&#x27;${k}&#x27;)&quot;&gt;${na?l:(o||l)}&lt;/button&gt;`}).join(&#x27;&#x27;);
  const v=vars[cur]||(sc.variants?sc.variants[0]:undefined);
  document.getElementById(&#x27;vars&#x27;).style.display=sc.variants?&#x27;flex&#x27;:&#x27;none&#x27;;
  document.getElementById(&#x27;vars&#x27;).innerHTML=sc.variants?sc.variants.map(x=&gt;`&lt;button class=&quot;${x===v?&#x27;on&#x27;:&#x27;&#x27;}&quot; onclick=&quot;setVar(&#x27;${x.replace(/&#x27;/g,&quot;\\&#x27;&quot;)}&#x27;)&quot;&gt;${x}&lt;/button&gt;`).join(&#x27;&#x27;):&#x27;&#x27;;
  document.getElementById(&#x27;prev&#x27;).disabled=idx===0; document.getElementById(&#x27;next&#x27;).disabled=idx===ORDER.length-1;
  document.getElementById(&#x27;url&#x27;).textContent=sc.url;
  document.getElementById(&#x27;fit&#x27;).innerHTML=sc.render(state,v);
  const n=sc.notes;
  const stt=STATES.map(([k,l])=&gt;{const o=(sc.states||{})[k];return o?`${l} → &lt;b&gt;${o}&lt;/b&gt;`:`${l} ✓`}).join(&#x27; · &#x27;);
  document.getElementById(&#x27;notes&#x27;).innerHTML=`
   &lt;div class=&quot;ncard&quot;&gt;&lt;h5&gt;What happens here&lt;/h5&gt;&lt;p&gt;${n.what}&lt;/p&gt;&lt;h5 style=&quot;margin-top:14px&quot;&gt;4-State Matrix&lt;/h5&gt;&lt;p class=&quot;stt&quot;&gt;${stt}&lt;/p&gt;
    ${idx&lt;ORDER.length-1?`&lt;h5 style=&quot;margin-top:14px&quot;&gt;Next in flow&lt;/h5&gt;&lt;p&gt;&lt;a href=&quot;#&quot; onclick=&quot;step(1);return false&quot; style=&quot;color:var(--primary);font-weight:600&quot;&gt;Step ${idx+1} · ${S[ORDER[idx+1]].t} →&lt;/a&gt;&lt;/p&gt;`:&#x27;&#x27;}&lt;/div&gt;
   &lt;div class=&quot;ncard&quot;&gt;&lt;h5&gt;Rules&lt;/h5&gt;&lt;ul&gt;${n.rules.map(r=&gt;`&lt;li&gt;${r}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;&lt;/div&gt;
   &lt;div class=&quot;ncard&quot;&gt;${n.pending.length?`&lt;h5&gt;Pending Client Decisions&lt;/h5&gt;${n.pending.map(p=&gt;`&lt;div class=&quot;pend&quot;&gt;${p}&lt;/div&gt;`).join(&#x27;&#x27;)}`:&#x27;&#x27;}&lt;h5 ${n.pending.length?&#x27;style=&quot;margin-top:12px&quot;&#x27;:&#x27;&#x27;}&gt;Dev Notes (from code)&lt;/h5&gt;${n.dev.map(d=&gt;`&lt;div class=&quot;dev&quot;&gt;${d}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
  requestAnimationFrame(fit);
}
window.addEventListener(&#x27;resize&#x27;,fit);
draw();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
<script>
function show(t){
  document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  document.querySelectorAll('iframe').forEach(f=>f.classList.toggle('on',f.id==='f-'+t));
  try{history.replaceState(null,'','#'+t)}catch(e){}
}
show(location.hash==='#email'?'email':'chat');
</script>
</body>
</html>
