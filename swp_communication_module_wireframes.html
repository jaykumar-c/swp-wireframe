<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWP Chat Wireframes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<style>
/* ===== Tokens: copied from shallwe-play-players/src/constants/Colors.ts (light) + BookingsScreen.tsx tabs ===== */
:root{
  --primary:#007AFF; --tab-active:#3B82F6; --tab-wrap:#E1EAEA; --seg-text:#1F2937;
  --text:#11181C; --text2:#777777; --icon:#687076; --bg:#f0f0f0; --card:#FFFFFF;
  --border:#E5E5E5; --danger:#E63900; --error:#FF3B30; --success:#22C55E; --disabled:#BDBDBD;
  --primary-soft:rgba(0,122,255,.08); --danger-soft:rgba(230,57,0,.08); --success-soft:rgba(34,197,94,.10);
  --warn-bg:#FEF3C7; --warn-text:#92400E;
  /* page chrome (not part of the app) */
  --page:#F5F5F9; --ink:#1C1C1C; --muted:#64748B; --line:#E2E8F0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);font-family:'Lato',system-ui,sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font:inherit}

/* ===== Page layout ===== */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font:700 18px Montserrat}
.top p{font-size:13px;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.layout{display:grid;grid-template-columns:250px 1fr 360px;gap:20px;max-width:1440px;margin:0 auto;padding:20px 24px}
.nav{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;align-self:start;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.nav h4{font:600 11px Montserrat;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 8px 6px}
.nav h4:first-child{margin-top:4px}
.nav button{display:flex;gap:8px;width:100%;text-align:left;padding:8px;border-radius:6px;font-size:14px;color:var(--ink)}
.nav button .n{font:600 12px Montserrat;color:var(--muted);min-width:20px}
.nav button:hover{background:#F1F5F9}
.nav button.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav button.on .n{color:var(--primary)}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.switch{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px}
.switch button{padding:7px 14px;border-radius:6px;font:600 13px Montserrat;color:var(--muted)}
.switch button.on{background:var(--primary);color:#fff}
.switch button.na{opacity:.45}
.variants{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:30px}
.variants button{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--muted)}
.variants button.on{border-color:var(--primary);color:var(--primary);font-weight:700}
.notes{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;align-self:start;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.notes h2{font:700 18px Montserrat;margin-bottom:4px}
.notes .flow{font:600 11px Montserrat;text-transform:uppercase;letter-spacing:.6px;color:var(--primary)}
.notes h5{font:600 11px Montserrat;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 6px}
.notes p,.notes li{font-size:14px;line-height:1.5;color:#334155}
.notes ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pend{background:var(--warn-bg);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.45;color:var(--warn-text)}
.pend b{display:block;font:700 12px Montserrat;margin-bottom:2px}
.chg li{color:#334155}
.src{font-size:12px!important;color:var(--muted)!important;font-family:ui-monospace,Menlo,monospace}
.statebox{font-size:13px;background:#F8FAFC;border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:#334155}

@media (max-width:1100px){.layout{grid-template-columns:1fr}.nav,.notes{position:static;max-height:none}}

/* ===== Phone shell ===== */
.ph{width:375px;height:780px;border-radius:44px;border:10px solid #11181C;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(17,24,28,.18)}
.sbar{height:34px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font:700 14px Lato;color:var(--text)}
.sbar .r{display:flex;gap:4px;font-size:15px}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;font-family:'Lato',sans-serif;color:var(--text)}
.body{flex:1;overflow-y:auto;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.homebar{height:20px;flex-shrink:0;display:flex;justify-content:center;align-items:center}
.homebar i{width:120px;height:4px;border-radius:2px;background:#11181C;opacity:.85}

/* ===== App components (matched to live RN styles) ===== */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;flex-shrink:0;min-height:56px}
.hdr .t{font:800 20px/25px Montserrat;letter-spacing:.5px;text-transform:uppercase;text-align:center;flex:1}
.back{width:36px;height:36px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:var(--text)}
.hbtn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--primary);flex-shrink:0;position:relative}
.hbtn.grey{color:var(--icon)}
.sp36{width:36px;flex-shrink:0}
.chdr{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;min-height:60px}
.chdr .who{flex:1;min-width:0}
.chdr .nm{font:700 16px/20px Montserrat;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.chdr .sub{font-size:13px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:600 16px Lato;flex-shrink:0}
.search{display:flex;align-items:center;gap:8px;margin:0 16px 12px;border:1.5px solid var(--primary);border-radius:12px;padding:10px 12px;background:transparent}
.search ion-icon{font-size:20px;color:var(--primary)}
.search input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--text)}
.search input::placeholder{color:#9CA3AF}
.tabs{display:flex;margin:0 16px 12px;background:var(--tab-wrap);border-radius:8px;padding:8px}
.tabs button{flex:1;padding:10px 0;background:#fff;font:500 12px Lato;color:var(--seg-text);border-radius:0}
.tabs button:first-child{border-radius:6px 0 0 6px}
.tabs button:last-child{border-radius:0 6px 6px 0}
.tabs button.on{background:var(--tab-active);color:#fff}
.sec{font:600 12px Montserrat;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);padding:4px 20px 8px}
.row{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:12px;margin:0 16px 8px}
.row .info{flex:1;min-width:0}
.row .l1{display:flex;align-items:center;gap:6px;justify-content:space-between}
.row .nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:12px;color:var(--text2);flex-shrink:0}
.row .l2{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:3px}
.row .pv{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv.b{color:var(--text);font-weight:700}
.row.dim .nm,.row.dim .pv{color:var(--text2)}
.badge{min-width:20px;height:20px;border-radius:10px;padding:0 6px;background:var(--primary);color:#fff;font:700 12px Lato;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;border-radius:6px;font:700 11px Lato;flex-shrink:0;background:var(--primary-soft);color:var(--primary)}
.tag.grey{background:#EBEBEB;color:var(--text2)}
.tag.green{background:var(--success-soft);color:#15803D}
.tag.warn{background:var(--warn-bg);color:var(--warn-text)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.feed{flex:1;overflow-y:auto;scrollbar-width:none;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.feed::-webkit-scrollbar{display:none}
.dd{align-self:center;font:700 12px Lato;color:var(--text2);padding:6px 0}
.sys{align-self:center;max-width:88%;text-align:center;font-size:13px;line-height:1.4;color:var(--text2);background:#E7E7E7;border-radius:10px;padding:6px 12px}
.msg{display:flex;gap:8px;max-width:80%;align-items:flex-end}
.msg.in{align-self:flex-start}
.msg.out{align-self:flex-end;flex-direction:row-reverse}
.msg .col{display:flex;flex-direction:column;min-width:0}
.msg.out .col{align-items:flex-end}
.snd{font:700 12px Lato;color:var(--icon);margin:0 0 3px 4px}
.snd .tag{height:17px;font-size:10px;margin-left:4px;padding:0 5px}
.bub{padding:9px 12px;border-radius:16px;font-size:15px;line-height:21px;word-wrap:break-word}
.in .bub{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.out .bub{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.mt{font-size:12px;color:var(--text2);margin:3px 4px 0}
.mt.err{color:var(--error);display:flex;align-items:center;gap:4px;font-weight:700}
.out .bub.failed{background:#8FBFFF}
.photo{width:200px;height:140px;border-radius:12px;background:linear-gradient(135deg,#C9D6E3,#9FB3C8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;position:relative;overflow:hidden}
.photo .vid{position:absolute;bottom:8px;left:8px;font:700 12px Lato;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 6px;display:flex;align-items:center;gap:3px}
.shared{width:240px;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.shared .h{background:var(--primary-soft);padding:8px 12px;font:700 12px Montserrat;color:var(--primary);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.4px}
.shared .c{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.shared .c b{font-size:15px}
.shared .c span{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
.shared .c .btn{margin-top:6px;height:38px;font-size:14px}
.comp{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-top:1px solid var(--border);flex-shrink:0}
.comp .att{font-size:24px;color:var(--icon);display:flex}
.comp .in{flex:1;height:40px;border-radius:20px;background:var(--bg);border:1px solid transparent;padding:0 14px;font-size:15px;outline:none;color:var(--text)}
.comp .in:focus{border-color:var(--primary);background:#fff}
.comp .send{width:40px;height:40px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.comp .send.off{background:var(--disabled)}
.lock{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;background:#fff;border-top:1px solid var(--border);flex-shrink:0}
.lock ion-icon{font-size:20px;color:var(--icon);flex-shrink:0;margin-top:1px}
.lock b{font-size:14px;display:block}
.lock span{font-size:13px;color:var(--text2);line-height:1.4}
.ctx{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;flex-shrink:0}
.ctx .ti{width:40px;height:40px;border-radius:8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ctx .i{flex:1;min-width:0}
.ctx b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx span{font-size:13px;color:var(--text2)}
.ctx a{font:700 14px Lato;color:var(--primary);text-decoration:none;flex-shrink:0}
.ban{display:flex;gap:8px;align-items:flex-start;padding:8px 16px;font-size:13px;line-height:1.4;flex-shrink:0}
.ban ion-icon{font-size:17px;flex-shrink:0;margin-top:1px}
.ban.info{background:#EAF3FF;color:var(--text)}
.ban.info ion-icon{color:var(--primary)}
.ban.warn{background:var(--warn-bg);color:var(--warn-text)}
.ban.err{background:var(--danger-soft);color:var(--danger)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:8px;font:600 16px Montserrat}
.btn.p{background:var(--primary);color:#fff}
.btn.p.off{background:var(--disabled)}
.btn.n{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn.d{background:var(--danger);color:#fff}
.btn.sm{height:40px;font-size:14px}
.btnrow{display:flex;gap:10px}
.foot{padding:12px 16px 8px;flex-shrink:0;background:var(--bg)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 32px;gap:10px}
.center .bigic{width:88px;height:88px;border-radius:44px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--icon);box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:8px}
.center .bigic.red{color:var(--error)}
.center h3{font:700 18px Montserrat}
.center p{font-size:15px;line-height:22px;color:var(--text2)}
.center .btn{margin-top:10px;width:auto;padding:0 24px}
.sk{background:#E2E2E2;border-radius:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.ov{position:absolute;inset:0;background:rgba(17,24,28,.45);display:flex;z-index:20}
.ov.bottom{align-items:flex-end}
.ov.mid{align-items:center;justify-content:center;padding:24px}
.sheet{width:100%;background:#fff;border-radius:16px 16px 0 0;padding:8px 0 16px}
.sheet .hd{width:36px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 8px}
.sheet .st{font:700 16px Montserrat;padding:6px 20px 10px}
.sheet .it{display:flex;align-items:center;gap:14px;padding:0 20px;height:52px;font-size:16px;width:100%;text-align:left}
.sheet .it ion-icon{font-size:22px;color:var(--icon)}
.sheet .it.red,.sheet .it.red ion-icon{color:var(--danger)}
.modal{width:100%;background:#fff;border-radius:12px;padding:20px}
.modal h3{font:700 18px Montserrat;margin-bottom:8px}
.modal p{font-size:15px;line-height:22px;color:var(--text2);margin-bottom:18px}
.notch{position:relative;border:1px solid var(--border);border-radius:8px;min-height:56px;padding:16px;margin:12px 0 4px;background:transparent}
.notch.foc{border-color:var(--primary)}
.notch.bad{border-color:var(--error)}
.notch label{position:absolute;top:-10px;left:12px;padding:0 4px;background:var(--bg);font-size:14px;color:var(--text2)}
.notch.foc label{color:var(--primary)}
.notch.bad label{color:var(--error)}
.notch .v{font-size:16px}
.ferr{font-size:12px;color:var(--error);margin:4px 4px 0}
.fhelp{font-size:12px;color:var(--text2);margin:4px 4px 0;display:flex;justify-content:space-between}
.radio{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:14px 12px;margin-bottom:8px;font-size:15px}
.radio i{width:20px;height:20px;border-radius:10px;border:2px solid var(--disabled);flex-shrink:0}
.radio.on i{border:6px solid var(--primary)}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--disabled);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.chk.on{background:var(--primary);border-color:var(--primary)}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chip{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;width:56px;flex-shrink:0;position:relative}
.chip .x{position:absolute;top:-2px;right:4px;width:18px;height:18px;border-radius:9px;background:var(--icon);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid var(--bg)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;background:#11181C;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;z-index:30;display:flex;gap:8px;align-items:center}
.push{margin:8px 10px;background:rgba(255,255,255,.96);border-radius:16px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:flex;gap:10px}
.push .app{width:22px;height:22px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0}
.push .h{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:2px}
.push b{font-size:15px;display:block}
.push p{font-size:14px;color:var(--text);margin-top:1px}
.prof-cover{height:110px;background:linear-gradient(135deg,#9FB3C8,#5E7A96)}
.prof{padding:0 16px;margin-top:-36px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.prof .av{border:4px solid var(--bg)}
.prof h3{font:700 20px Montserrat;margin-top:6px}
.prof p{font-size:14px;color:var(--text2)}
.stat3{display:flex;justify-content:center;gap:24px;margin:12px 0}
.stat3 div{text-align:center;font-size:13px;color:var(--text2)}
.stat3 b{display:block;font:700 16px Montserrat;color:var(--text)}
.email{margin:12px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.email .eh{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);line-height:1.6}
.email .eh b{color:var(--text)}
.email .eb{padding:16px 14px;font-size:15px;line-height:22px}
.email .quote{border-left:3px solid var(--primary);padding:6px 10px;background:#F8F9FA;margin:10px 0 14px;color:var(--text2);font-size:14px}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Communication Module · Player App Wireframes</h1>
    <p>Release 1 scope only · Matched to live <code>shallwe-play-players</code> tokens (light theme) · v2 · 26 Nov 2026</p>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#007AFF"></i>Primary #007AFF</span>
    <span><i class="dot" style="background:#f0f0f0;border:1px solid #ccc"></i>Canvas #f0f0f0</span>
    <span><i class="dot" style="background:#777"></i>Secondary #777</span>
    <span><i class="dot" style="background:#E63900"></i>Danger #E63900</span>
    <span><i class="dot" style="background:#FEF3C7;border:1px solid #F59E0B"></i>Pending client decision</span>
  </div>
</header>

<div class="layout">
  <nav class="nav" id="nav"></nav>
  <section class="stage">
    <div class="switch" id="switch"></div>
    <div class="variants" id="variants"></div>
    <div class="ph">
      <div class="sbar"><span>9:41</span><span class="r"><ion-icon name="cellular"></ion-icon><ion-icon name="wifi"></ion-icon><ion-icon name="battery-full"></ion-icon></span></div>
      <div class="scr" id="scr"></div>
      <div class="homebar"><i></i></div>
    </div>
  </section>
  <aside class="notes" id="notes"></aside>
</div>

<script>
/* ---------------- helpers ---------------- */
const ic = (n, s='', st='') => `<ion-icon name="${n}" ${s?`style="font-size:${s}px;${st}"`:(st?`style="${st}"`:'')}></ion-icon>`;
const AVC = {E:'#E67E22',S:'#3B82F6',L:'#8B5CF6',M:'#0D9488',A:'#007AFF',C:'#061D42',T:'#DB2777',J:'#16A34A',R:'#64748B'};
const av = (t, size=44, bg, icon) => `<div class="av" style="width:${size}px;height:${size}px;background:${bg||AVC[t[0]]||'#007AFF'};font-size:${Math.round(size*.36)}px">${icon?ic(icon, Math.round(size*.46)):t}</div>`;
const back = (to) => `<button class="back" onclick="go('${to||''}')">${ic('chevron-back',16)}</button>`;
const hdr = (title, left, right) => `<div class="hdr">${left||'<div class="sp36"></div>'}<div class="t">${title}</div>${right||'<div class="sp36"></div>'}</div>`;
const chdr = (avatar, name, sub, right, backTo='inbox') => `<div class="chdr">${back(backTo)}${avatar}<div class="who"><div class="nm">${name}</div><div class="sub">${sub}</div></div>${right||''}</div>`;
const more = (fn) => `<button class="hbtn grey" onclick="${fn||"go('chat_options')"}">${ic('ellipsis-vertical',22)}</button>`;
const search = (ph) => `<div class="search">${ic('search')}<input placeholder="${ph}"></div>`;
const tabs = (list, on) => `<div class="tabs">${list.map(t=>`<button class="${t===on?'on':''}">${t}</button>`).join('')}</div>`;
const dd = (t) => `<div class="dd">${t}</div>`;
const sys = (t) => `<div class="sys">${t}</div>`;
const mIn = (text, time, sender, role) => `<div class="msg in">${sender?av(sender[0],28):''}<div class="col">${sender?`<div class="snd">${sender}${role?`<span class="tag ${role==='Coach'||role==='Club Staff'||role==='SWP Support'?'':'grey'}">${role}</span>`:''}</div>`:''}<div class="bub">${text}</div><div class="mt">${time}</div></div></div>`;
const mOut = (text, time, failed) => `<div class="msg out"><div class="col"><div class="bub ${failed?'failed':''}">${text}</div>${failed?`<div class="mt err">${ic('alert-circle',14)} Not sent · Tap to retry</div>`:`<div class="mt">${time}</div>`}</div></div>`;
const photoMsg = (dir, time, video) => `<div class="msg ${dir}"><div class="col"><div class="photo">${ic(video?'play-circle':'image-outline',36)}${video?`<span class="vid">${ic('videocam',12)} 0:14</span>`:''}</div><div class="mt">${time}</div></div></div>`;
const comp = (ph, typed) => `<div class="comp"><button class="att" onclick="go('media_preview')">${ic('image-outline')}</button><input class="in" placeholder="${ph}" value="${typed||''}"><button class="send ${typed?'':'off'}">${ic('send',18)}</button></div>`;
const lock = (title, text, icon='lock-closed-outline') => `<div class="lock">${ic(icon)}<div><b>${title}</b><span>${text}</span></div></div>`;
const ctx = (icon, title, sub, link='View') => `<div class="ctx"><div class="ti">${ic(icon)}</div><div class="i"><b>${title}</b><span>${sub}</span></div><a href="#" onclick="return false">${link}</a></div>`;
const ban = (kind, icon, html) => `<div class="ban ${kind}">${ic(icon)}<div>${html}</div></div>`;
const center = (icon, title, text, btn, red) => `<div class="center"><div class="bigic ${red?'red':''}">${ic(icon)}</div><h3>${title}</h3><p>${text}</p>${btn||''}</div>`;
const errBlock = (title, text) => center('cloud-offline-outline', title, text, `<button class="btn p sm">${ic('refresh',18)} Try Again</button>`, true);
const skRows = (n=6) => Array.from({length:n}).map(()=>`<div class="row"><div class="sk" style="width:44px;height:44px;border-radius:22px"></div><div class="info"><div class="sk" style="width:55%;height:14px;margin-bottom:8px"></div><div class="sk" style="width:85%;height:12px"></div></div></div>`).join('');
const skFeed = () => `<div class="feed">${[['in',62],['in',40],['out',55],['in',70],['out',38]].map(([d,w])=>`<div class="msg ${d}"><div class="sk" style="width:${w*2.4}px;height:38px;border-radius:16px"></div></div>`).join('')}</div>`;
const naNote = (why) => `<div class="center"><div class="bigic">${ic('information-circle-outline')}</div><h3>Not Applicable</h3><p>${why}</p></div>`;

S.report = {

const LIFE = ['Active','Closing Soon','Closed','Cancelled'];
function activityChat(st, v, o){
  const h = chdr(av('',38,o.color||'#007AFF',o.icon), o.name, o.sub, `<button class="hbtn" onclick="go('members')">${ic('people-outline',24)}</button>`+more(), 'inbox');
  const c = ctx(o.ctxIcon, o.ctxTitle, o.ctxSub);
  if (st==='loading') return h + c + skFeed() + comp('Message');
  if (st==='error' && o.errorGate) return h + c + o.errorGate;
  let banner='', footer=comp('Message'), extra='';
  if (v==='Active') banner = ban('info','time-outline', o.activeBanner);
  if (v==='Closing Soon') banner = ban('warn','alarm-outline','This chat closes in <b>45 min</b>. Messages will stay saved.');
  if (v==='Closed') footer = lock('This chat is closed', `Closed on ${o.closedAt}. You can still read old messages.`);
  if (v==='Cancelled'){ extra = sys(o.cancelLine); banner = ban('warn','alert-circle-outline', o.cancelBanner); }
  if (st==='empty') return h + c + banner + `<div class="feed">${o.createdLines}<div style="margin:auto;text-align:center;color:var(--text2);font-size:14px;padding:20px">${ic('chatbubbles-outline',36,'color:#BDBDBD')}<div style="margin-top:6px">No messages yet. Say hi to your group.</div></div></div>` + footer;
  let msgs = o.msgs;
  if (st==='error') msgs = msgs.replace('%LAST%', mOut(o.lastOut,'',true)); else msgs = msgs.replace('%LAST%', mOut(o.lastOut,o.lastTime));
  return h + c + banner + `<div class="feed">${o.createdLines}${msgs}${extra}</div>` + footer;
}

/* ---------------- nav / state ---------------- */
const ORDER = ['home_entry','inbox','new_chat','direct_chat','chat_options','report','block','club_profile','club_chat','booking_chat','event_chat','lesson_chat','members','group_create','group_chat','support','media_preview','notifications'];
let cur = 'inbox', state = 'populated', vars = {};
const STATES = [['populated','Populated'],['empty','Empty'],['loading','Loading'],['error','Error']];

function go(id){ if(!id||!S[id]) return; cur=id; state='populated'; draw(); }
function setState(s){ state=s; draw(); }
function setVar(v){ vars[cur]=v; draw(); }

function draw(){
  const sc = S[cur];
  // nav
  let html='', lastFlow='';
  ORDER.forEach((id,i)=>{ const s=S[id]; if(s.flow!==lastFlow){ html+=`<h4>${s.flow}</h4>`; lastFlow=s.flow; } html+=`<button class="${id===cur?'on':''}" onclick="go('${id}')"><span class="n">${String(i+1).padStart(2,'0')}</span>${s.title}</button>`; });
  document.getElementById('nav').innerHTML = html;
  // state switch
  document.getElementById('switch').innerHTML = STATES.map(([k,l])=>{ const o=(sc.states||{})[k]; const na=o==='N/A'; return `<button class="${state===k?'on':''} ${na?'na':''}" onclick="setState('${k}')" title="${na?'Not applicable for this screen':''}">${na?l:(o||l)}</button>`; }).join('');
  // variants
  const v = vars[cur] || (sc.variants?sc.variants[0]:undefined);
  document.getElementById('variants').innerHTML = sc.variants ? sc.variants.map(x=>`<button class="${x===v?'on':''}" onclick="setVar('${x.replace(/'/g,"\\'")}')">${x}</button>`).join('') : '';
  // screen
  document.getElementById('scr').innerHTML = sc.render(state, v);
  // notes
  const n = sc.notes;
  const stInfo = STATES.map(([k,l])=>{const o=(sc.states||{})[k]; return `${l}${o&&o!==l?` → <b>${o}</b>`:''}`}).join(' · ');
  document.getElementById('notes').innerHTML = `
    <div class="flow">${sc.flow} · Screen ${String(ORDER.indexOf(cur)+1).padStart(2,'0')}</div><h2>${sc.title}</h2>
    <p>${n.purpose}</p>
    <h5>4-State Matrix</h5><div class="statebox">${stInfo}</div>
    <h5>Rules</h5><ul>${n.rules.map(r=>`<li>${r}</li>`).join('')}</ul>
    ${n.pending.length?`<h5>Pending Client Decisions</h5>${n.pending.map(p=>`<div class="pend">${p}</div>`).join('')}`:''}
    <h5>Changed vs v1 Wireframe</h5><ul class="chg">${n.changed.map(r=>`<li>${r}</li>`).join('')}</ul>
    <h5>Source</h5><ul>${n.src.map(r=>`<li class="src">${r}</li>`).join('')}</ul>`;
}
draw();
</script>
